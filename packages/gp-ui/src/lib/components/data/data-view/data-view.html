<div class="gp-data-view gp-dataview" [class.gp-data-view--list]="layout() === 'list'" [class.gp-dataview-list]="layout() === 'list'" [class.gp-data-view--grid]="layout() === 'grid'" [class.gp-dataview-grid]="layout() === 'grid'">
  @if (headerTemplate() || layoutOptions()) {
    <div class="gp-data-view__header gp-dataview-header">
      <div class="gp-dataview-header-content">
        <ng-content select="[header]" />
      </div>

      @if (layoutOptions()) {
        <div class="gp-data-view__layout-options gp-dataview-layout-options">
          <button
            type="button"
            class="gp-data-view__layout-btn gp-dataview-layout-btn"
            [class.gp-data-view__layout-btn--active]="layout() === 'list'"
            (click)="setLayout('list')"
            aria-label="List view"
          >
            <gp-icon name="bars" size="0.9em" />
          </button>
          <button
            type="button"
            class="gp-data-view__layout-btn gp-dataview-layout-btn"
            [class.gp-data-view__layout-btn--active]="layout() === 'grid'"
            (click)="setLayout('grid')"
            aria-label="Grid view"
          >
            <gp-icon name="window" size="0.9em" />
          </button>
        </div>
      }
    </div>
  }

  <div class="gp-data-view__content gp-dataview-content">
    @if (layout() === 'list') {
      <div class="gp-data-view__list-grid gp-dataview-list-grid">
        @for (item of displayedValue(); track $index) {
          <div class="gp-dataview-list-item">
            <ng-container *ngTemplateOutlet="listItemTemplate() || itemTemplate()!; context: { $implicit: item }" />
          </div>
        }
      </div>
    } @else {
      <div class="gp-data-view__grid-grid gp-dataview-grid-grid">
        @for (item of displayedValue(); track $index) {
          <div class="gp-dataview-grid-item">
            <ng-container *ngTemplateOutlet="gridItemTemplate() || itemTemplate()!; context: { $implicit: item }" />
          </div>
        }
      </div>
    }
  </div>

  @if (paginator()) {
    <gp-paginator
      [totalRecords]="totalRecordsCount()"
      [rows]="rows()"
      [first]="first()"
      [rowsPerPageOptions]="rowsPerPageOptions()"
      (onPageChange)="onPaginationChange($event)"
    />
  }
</div>
