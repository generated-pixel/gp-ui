<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [class]="baseButtonClasses()"
  [attr.aria-label]="ariaLabel() || label() || null"
  [attr.aria-labelledby]="ariaLabelledBy() || null"
  [attr.aria-describedby]="ariaDescribedBy() || null"
  [attr.aria-disabled]="disabled() || loading()"
  [attr.aria-busy]="loading()"
  [attr.autofocus]="autofocus() ? '' : null"
  [attr.tabindex]="tabindex() !== undefined ? tabindex() : disabled() ? -1 : 0"
  (click)="onButtonClick($event)"
  (focus)="onButtonFocus($event)"
  (blur)="onButtonBlur($event)"
  (keydown)="onButtonKeyDown($event)"
  (keyup)="onButtonKeyUp($event)"
  (mouseenter)="onButtonMouseEnter($event)"
  (mouseleave)="onButtonMouseLeave($event)"
  (dblclick)="onButtonDoubleClick($event)"
  gpRipple
>
  @if (loading()) {
    <gp-icon [name]="loadingIcon()" [spin]="true" class="gp-button__loading-icon gp-button-loading-icon" />
  } @else if (icon() && (iconPos() === 'left' || iconPos() === 'top')) {
    <gp-icon [name]="icon()" class="gp-button__icon gp-button-icon" />
  }

  @if (label()) {
    <span class="gp-button__label gp-button-label">{{ label() }}</span>
  }

  <ng-content />

  @if (!loading() && icon() && (iconPos() === 'right' || iconPos() === 'bottom')) {
    <gp-icon [name]="icon()" class="gp-button__icon gp-button-icon" />
  }

  @if (badge()) {
    <span
      class="gp-button__badge gp-button-badge"
      [class.gp-button__badge--danger]="badgeSeverity() === 'danger'"
      [class.gp-button-badge-danger]="badgeSeverity() === 'danger'"
      [class]="'gp-badge-' + badgeSeverity()"
    >
      {{ badge() }}
    </span>
  }
</button>
