<div
  class="gp-split-button"
  [class.gp-split-button-expanded]="overlayVisible()"
  [class.gp-split-button-fluid]="fluid()"
  [class.gp-split-button-rounded]="rounded()"
  [class]="styleClass()"
  [style]="style()"
>
  <gp-button
    [label]="label()"
    [icon]="icon()"
    [iconPos]="iconPos()"
    [severity]="severity()"
    [variant]="effectiveVariant()"
    [size]="size()"
    [rounded]="rounded()"
    [raised]="raised()"
    [fluid]="fluid()"
    [loading]="loading()"
    [loadingIcon]="loadingIcon()"
    [badge]="badge()"
    [badgeSeverity]="badgeSeverity()"
    [disabled]="disabled()"
    [type]="type()"
    [autofocus]="autofocus()"
    [tabindex]="tabindex()"
    [ariaLabel]="ariaLabel() || label()"
    (onClickEvent)="onDefaultClick($event)"
    (onFocusEvent)="onButtonFocus($event)"
    (onBlurEvent)="onButtonBlur($event)"
    (onKeyDownEvent)="onButtonKeyDown($event)"
    (onKeyUpEvent)="onButtonKeyUp($event)"
    (onMouseEnterEvent)="onButtonMouseEnter($event)"
    (onMouseLeaveEvent)="onButtonMouseLeave($event)"
    (onDoubleClickEvent)="onButtonDoubleClick($event)"
  />
  <gp-button
    [icon]="dropdownIcon()"
    [severity]="severity()"
    [variant]="effectiveVariant()"
    [size]="size()"
    [rounded]="rounded()"
    [disabled]="disabled() || loading()"
    [iconOnly]="true"
    [ariaLabel]="'Toggle menu options'"
    [attr.aria-haspopup]="'menu'"
    [attr.aria-expanded]="overlayVisible()"
    (onClickEvent)="toggleOverlay($event)"
    class="gp-split-button-dropdown"
  />

  @if (overlayVisible()) {
    <div
      class="gp-menu-overlay gp-split-button-menu"
      role="menu"
      (click)="$event.stopPropagation()"
      [gpAppendTo]="appendTo()"
      [gpConnectedTo]="el"
    >
      <ul class="gp-menu-list">
        @for (item of model(); track $index) {
          @if (item.separator) {
            <li class="gp-menu-separator" role="separator"></li>
          } @else {
            <li
              class="gp-menu-item"
              [class.gp-menu-item-disabled]="item.disabled"
              role="menuitem"
              (click)="onItemClick(item, $event)"
            >
              <a
                [routerLink]="item.routerLink"
                [attr.href]="item.url || null"
                [attr.target]="item.target || null"
                class="gp-menu-item-link"
              >
                @if (item.icon) {
                  <gp-icon [name]="item.icon" class="gp-menu-item-icon" />
                }
                <span class="gp-menu-item-text">{{ item.label }}</span>
                @if (item.badge) {
                  <span class="gp-menu-item-badge">{{ item.badge }}</span>
                }
              </a>
            </li>
          }
        }
      </ul>
    </div>
  }
</div>
