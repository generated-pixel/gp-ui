<button
  type="button"
  [id]="inputId()"
  [disabled]="isEffectivelyDisabled()"
  [class]="toggleButtonClass()"
  [style]="style()"
  [attr.aria-pressed]="checked()"
  [attr.aria-label]="ariaLabel() || (checked() ? onLabel() : offLabel())"
  [attr.aria-labelledby]="ariaLabelledBy() || null"
  [attr.aria-describedby]="ariaDescribedBy() || null"
  [attr.autofocus]="autofocus() ? '' : null"
  [attr.tabindex]="tabindex() !== undefined ? tabindex() : isEffectivelyDisabled() ? -1 : 0"
  (click)="toggle($event)"
  (focus)="onFocus($event)"
  (blur)="onBlur($event)"
  (keydown)="onKeyDown($event)"
  (keyup)="onKeyUp($event)"
  gpRipple
>
  @if (iconPos() === 'left' || iconPos() === 'top') { @if (checked() && onIcon()) {
  <gp-icon [name]="onIcon()" class="gp-button__icon gp-button-icon" />
  } @else if (!checked() && offIcon()) {
  <gp-icon [name]="offIcon()" class="gp-button__icon gp-button-icon" />
  } }

  <span class="gp-button__label gp-button-label">{{ checked() ? onLabel() : offLabel() }}</span>

  @if (iconPos() === 'right' || iconPos() === 'bottom') { @if (checked() && onIcon()) {
  <gp-icon [name]="onIcon()" class="gp-button__icon gp-button-icon" />
  } @else if (!checked() && offIcon()) {
  <gp-icon [name]="offIcon()" class="gp-button__icon gp-button-icon" />
  } }
</button>
