<div
  class="gp-speed-dial"
  [class]="'gp-speed-dial--' + direction() + ' gp-speed-dial-direction-' + direction()"
  [class]="styleClass()"
  [style]="style()"
>
  <gp-button
    [icon]="visible() ? hideIcon() : showIcon()"
    [severity]="buttonSeverity()"
    [variant]="buttonVariant()"
    [size]="size()"
    [rounded]="true"
    [iconOnly]="true"
    [disabled]="disabled()"
    [ariaLabel]="ariaLabel() || (visible() ? 'Close speed dial actions' : 'Open speed dial actions')"
    [attr.aria-haspopup]="'menu'"
    [attr.aria-expanded]="visible()"
    (onClickEvent)="onTriggerClick($event)"
    (onFocusEvent)="onButtonFocus($event)"
    (onBlurEvent)="onButtonBlur($event)"
    class="gp-speed-dial__button gp-speed-dial-button"
  />

  @if (visible()) {
  <ul class="gp-speed-dial__list gp-speed-dial-list" role="menu">
    @for (item of model(); track $index) {
    <li class="gp-speed-dial__item gp-speed-dial-item" role="none">
      <gp-button
        [icon]="item.icon || 'star'"
        [severity]="'secondary'"
        [rounded]="true"
        [size]="'sm'"
        [ariaLabel]="item.label || 'Speed dial action ' + ($index + 1)"
        [gpTooltip]="item.label || ''"
        [tooltipPosition]="direction() === 'up' ? 'left' : direction() === 'down' ? 'left' : 'top'"
        [disabled]="item.disabled || false"
        (onClickEvent)="onItemClick(item, $event)"
        class="gp-speed-dial__action gp-speed-dial-action"
      />
    </li>
    }
  </ul>
  }
</div>
