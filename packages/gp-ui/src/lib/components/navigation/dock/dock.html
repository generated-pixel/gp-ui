<div class="gp-dock" [class]="'gp-dock-' + dockPosition()">
  <ul class="gp-dock-list" role="toolbar">
    @for (item of model(); track $index) {
      <li class="gp-dock-item" role="none">
        <a
          [routerLink]="item.routerLink"
          [attr.href]="item.url || null"
          class="gp-dock-link"
          [attr.aria-label]="item.label || 'Dock item ' + ($index + 1)"
          [gpTooltip]="item.label || ''"
          [tooltipPosition]="dockPosition() === 'bottom' ? 'top' : 'bottom'"
          (click)="onItemClick(item, $event)"
          role="button"
        >
          @if (item.icon) {
            <gp-icon [name]="item.icon" size="1.75em" />
          }
        </a>
      </li>
    }
  </ul>
</div>
