<div
  class="gp-switch"
  [class.gp-switch-checked]="checked()"
  [class.gp-switch-disabled]="isEffectivelyDisabled()"
  [class.gp-input-invalid]="isInvalid()"
  (click)="toggle($event)"
>
  <div
    class="gp-switch-slider"
    role="switch"
    [attr.aria-checked]="checked()"
    [attr.aria-disabled]="isEffectivelyDisabled()"
    [attr.aria-label]="ariaLabel() || placeholder() || null"
    tabindex="0"
    (keydown.enter)="$event.preventDefault(); toggle($event)"
    (keydown.space)="$event.preventDefault(); toggle($event)"
  >
    <span class="gp-switch-handle"></span>
  </div>

  @if (label()) {
    <span class="gp-switch-label">{{ label() }}</span>
  }
</div>
