<div
  class="gp-slider"
  [class.gp-slider-disabled]="isEffectivelyDisabled()"
  [class.gp-slider-dragging]="isDragging()"
  [class.gp-slider-vertical]="orientation() === 'vertical'"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
>
  <div class="gp-slider-track">
    <div
      class="gp-slider-range"
      [style.width.%]="orientation() === 'horizontal' ? percentage() : null"
      [style.height.%]="orientation() === 'vertical' ? percentage() : null"
    ></div>
  </div>
  <span
    class="gp-slider-handle"
    [style.left.%]="orientation() === 'horizontal' ? percentage() : null"
    [style.bottom.%]="orientation() === 'vertical' ? percentage() : null"
    tabindex="0"
    role="slider"
    [attr.aria-valuenow]="displayValue()"
    [attr.aria-valuemin]="min()"
    [attr.aria-valuemax]="max()"
    [attr.aria-disabled]="isEffectivelyDisabled()"
    [attr.aria-orientation]="orientation()"
    (keydown)="onKeyDown($event)"
  ></span>
</div>
