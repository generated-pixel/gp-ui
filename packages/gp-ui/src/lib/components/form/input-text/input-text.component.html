<div
  class="gp-input-wrapper"
  [class.gp-input-disabled]="isEffectivelyDisabled()"
  [class.gp-input-filled]="!!internalValue()"
  [class.gp-input-invalid]="isInvalid()"
  [class.gp-input-with-prefix]="!!iconLeft()"
  [class.gp-input-with-suffix]="!!iconRight() || (clearable() && !!internalValue())"
  [class]="styleClass()"
  [style]="style()"
>
  @if (iconLeft()) {
    <gp-icon [name]="iconLeft()" class="gp-input-icon gp-input-icon-left" />
  }

  <input
    [id]="inputId()"
    [type]="type()"
    [value]="internalValue() || ''"
    [placeholder]="placeholder()"
    [disabled]="isEffectivelyDisabled()"
    [readonly]="readonly()"
    [attr.maxlength]="maxlength() || null"
    [attr.minlength]="minlength() || null"
    [attr.autocomplete]="autocomplete()"
    [attr.autofocus]="autofocus() ? '' : null"
    [attr.tabindex]="tabindex() !== undefined ? tabindex() : (isEffectivelyDisabled() ? -1 : 0)"
    [attr.aria-label]="ariaLabel() || placeholder() || null"
    [attr.aria-invalid]="isInvalid()"
    [attr.aria-required]="required()"
    (input)="handleInput($event)"
    (focus)="handleFocus($event)"
    (blur)="handleBlur($event)"
    (keydown)="handleKeyDown($event)"
    (keyup)="handleKeyUp($event)"
    class="gp-inputtext"
  />

  @if (clearable() && !!internalValue() && !isEffectivelyDisabled() && !readonly()) {
    <button type="button" class="gp-input-clear-btn" aria-label="Clear input" (click)="clearInput($event)">
      <gp-icon name="times" size="0.9em" />
    </button>
  } @else if (iconRight()) {
    <gp-icon [name]="iconRight()" class="gp-input-icon gp-input-icon-right" />
  }
</div>
