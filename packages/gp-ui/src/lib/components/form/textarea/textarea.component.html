<div class="gp-textarea-wrapper" [class.gp-input-invalid]="isInvalid()" [class.gp-input-disabled]="isEffectivelyDisabled()">
  <textarea
    [id]="inputId()"
    [rows]="rows()"
    [cols]="cols()"
    [value]="internalValue() || ''"
    [placeholder]="placeholder()"
    [disabled]="isEffectivelyDisabled()"
    [readonly]="readonly()"
    [attr.maxlength]="maxlength() || null"
    [attr.aria-label]="ariaLabel() || placeholder() || null"
    [attr.aria-invalid]="isInvalid()"
    [attr.aria-required]="required()"
    [class.gp-textarea-auto-resize]="autoResize()"
    (input)="onInput($event)"
    (focus)="onFocus($event)"
    (blur)="onBlur($event)"
    class="gp-inputtext gp-textarea"
  ></textarea>

  @if (maxlength() && showCounter()) {
    <div class="gp-textarea-counter">{{ (internalValue() || '').length }} / {{ maxlength() }}</div>
  }
</div>
