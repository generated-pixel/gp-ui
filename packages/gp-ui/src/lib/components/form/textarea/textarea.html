<div
  class="gp-textarea-wrapper"
  [class.gp-input-invalid]="isInvalid()"
  [class.gp-input-disabled]="isEffectivelyDisabled()"
  [class]="styleClass()"
  [style]="style()"
>
  <textarea
    [id]="inputId()"
    [rows]="rows()"
    [cols]="cols()"
    [value]="internalValue() || ''"
    [placeholder]="placeholder()"
    [disabled]="isEffectivelyDisabled()"
    [readonly]="readonly()"
    [attr.maxlength]="maxlength() || null"
    [attr.minlength]="minlength() || null"
    [attr.autofocus]="autofocus() ? '' : null"
    [attr.tabindex]="tabindex() !== undefined ? tabindex() : isEffectivelyDisabled() ? -1 : 0"
    [attr.aria-label]="ariaLabel() || placeholder() || null"
    [attr.aria-labelledby]="ariaLabelledBy() || null"
    [attr.aria-describedby]="ariaDescribedBy() || null"
    [attr.aria-invalid]="isInvalid()"
    [attr.aria-required]="required()"
    [class.gp-textarea--auto-resize]="autoResize()" [class.gp-textarea-auto-resize]="autoResize()"
    (input)="handleInput($event)"
    (focus)="handleFocus($event)"
    (blur)="handleBlur($event)"
    (keydown)="handleKeyDown($event)"
    (keyup)="handleKeyUp($event)"
    class="gp-inputtext gp-textarea"
  ></textarea>

  @if (maxlength() && showCounter()) {
    <div class="gp-textarea__counter gp-textarea-counter">{{ (internalValue() || '').length }} / {{ maxlength() }}</div>
  }
</div>
