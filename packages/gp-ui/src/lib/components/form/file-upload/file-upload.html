<div class="gp-fileupload" [class.gp-fileupload-disabled]="isEffectivelyDisabled()">
  <div
    class="gp-fileupload-dropzone"
    [class.gp-fileupload-dragover]="dragOver()"
    (dragover)="onDragOver($event)"
    (dragleave)="dragOver.set(false)"
    (drop)="onDrop($event)"
    (click)="fileInput.click()"
    (keydown.enter)="fileInput.click()"
    (keydown.space)="$event.preventDefault(); fileInput.click()"
    [attr.tabindex]="isEffectivelyDisabled() ? -1 : 0"
    role="button"
    [attr.aria-label]="ariaLabel() || (chooseLabel() + ' - ' + dragDropLabel())"
  >
    <input
      #fileInput
      [id]="inputId()"
      type="file"
      [accept]="accept()"
      [multiple]="multiple()"
      [disabled]="isEffectivelyDisabled()"
      [attr.aria-label]="chooseLabel()"
      (change)="onFileSelect($event)"
      class="gp-sr-only"
    />

    <gp-icon [name]="icon()" size="2.5em" class="gp-fileupload-icon" />
    <div class="gp-fileupload-title">{{ chooseLabel() }}</div>
    <div class="gp-fileupload-subtitle">{{ dragDropLabel() }}</div>
  </div>

  @if (files().length > 0) {
    <div class="gp-fileupload-files" role="list" aria-label="Selected files">
      @for (f of files(); track f.name + f.size) {
        <div class="gp-fileupload-file-card" role="listitem">
          <gp-icon name="file" size="1.5em" class="gp-fileupload-file-icon" />
          <div class="gp-fileupload-file-info">
            <span class="gp-fileupload-file-name">{{ f.name }}</span>
            <span class="gp-fileupload-file-size">{{ formatSize(f.size) }}</span>
          </div>
          <button
            type="button"
            class="gp-fileupload-file-remove"
            (click)="removeFile(f, $event)"
            [attr.aria-label]="'Remove file ' + f.name"
          >
            <gp-icon name="times" size="0.85em" />
          </button>
        </div>
      }

      <div class="gp-fileupload-actions">
        <gp-button
          [label]="uploadLabel() || translationService.get('upload') || 'Upload'"
          icon="upload"
          severity="primary"
          [disabled]="isEffectivelyDisabled()"
          (onClickEvent)="upload()"
        />
        <gp-button
          [label]="cancelLabel() || translationService.get('clear') || 'Clear'"
          icon="times"
          variant="outlined"
          severity="secondary"
          (onClickEvent)="clear()"
        />
      </div>
    </div>
  }
</div>
