<div
  class="gp-checkbox"
  [class.gp-checkbox-checked]="isChecked()"
  [class.gp-checkbox-disabled]="isEffectivelyDisabled()"
  [class.gp-input-invalid]="isInvalid()"
  (click)="onClick($event)"
>
  <div
    class="gp-checkbox-box"
    [attr.id]="inputId()"
    [attr.aria-checked]="isChecked()"
    [attr.aria-disabled]="isEffectivelyDisabled()"
    [attr.aria-required]="required()"
    [attr.aria-invalid]="isInvalid()"
    [attr.aria-label]="ariaLabel() || label() || null"
    [attr.aria-labelledby]="ariaLabelledBy() || null"
    [attr.aria-describedby]="ariaDescribedBy() || null"
    role="checkbox"
    [attr.tabindex]="isEffectivelyDisabled() ? -1 : (tabindex() !== undefined ? tabindex() : 0)"
    (keydown.space)="$event.preventDefault(); onClick($event)"
    (keydown.enter)="$event.preventDefault(); onClick($event)"
    gpRipple
  >
    @if (isChecked()) {
      <gp-icon name="check" size="0.8em" class="gp-checkbox-icon" />
    }
  </div>

  @if (label()) {
    <label [for]="inputId()" class="gp-checkbox-label">{{ label() }}</label>
  }
</div>
