<div
  class="gp-progress-spinner"
  [style.width]="strokeWidth()"
  [style.height]="strokeWidth()"
  role="progressbar"
  aria-label="Loading"
>
  <svg class="gp-progress-spinner__svg gp-progress-spinner-svg" viewBox="25 25 50 50">
    <circle
      class="gp-progress-spinner__circle gp-progress-spinner-circle"
      cx="50"
      cy="50"
      r="20"
      fill="none"
      stroke-width="4"
      stroke-miterlimit="10"
    />
  </svg>
</div>
