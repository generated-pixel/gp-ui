@if (visible()) {
<div class="gp-message" [class]="'gp-message--' + severity() + ' gp-message-' + severity()" role="alert">
  <gp-icon [name]="icon() || defaultIcon()" size="1.25em" class="gp-message__icon gp-message-icon" />

  <div class="gp-message__content gp-message-content">
    @if (text()) {
    <span class="gp-message__text gp-message-text">{{ text() }}</span>
    }
    <ng-content />
  </div>

  @if (closable()) {
  <button
    type="button"
    class="gp-message__close gp-message-close"
    (click)="close()"
    [attr.aria-label]="translationService.get('close') || 'Close'"
  >
    <gp-icon name="times" size="0.85em" />
  </button>
  }
</div>
}
