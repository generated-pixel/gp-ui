<span
  class="gp-badge"
  [class]="'gp-badge--' + severity() + ' gp-badge-' + severity() + ' gp-badge--' + size() + ' gp-badge-' + size()"
  [class.gp-badge--dot]="!value() && value() !== 0"
  [class.gp-badge-dot]="!value() && value() !== 0"

>
  <span class="gp-badge__text gp-badge-text">{{ value() }}<ng-content /></span>
</span>
