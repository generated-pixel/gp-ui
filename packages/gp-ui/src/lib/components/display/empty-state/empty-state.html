<div class="gp-empty-state gp-emptystate">
  @if (icon()) {
    <div class="gp-empty-state__icon-wrap gp-emptystate-icon-wrap">
      <gp-icon [name]="icon()" size="2.5em" class="gp-empty-state__icon gp-emptystate-icon" />
    </div>
  }
  <h4 class="gp-empty-state__title gp-emptystate-title">{{ title() }}</h4>
  @if (message()) {
    <p class="gp-empty-state__message gp-emptystate-message">{{ message() }}</p>
  }
  <div class="gp-empty-state__actions gp-emptystate-actions">
    <ng-content />
  </div>
</div>
