<div class="gp-image" [style.width]="width()" [style.height]="height()">
  <img [src]="src()" [alt]="alt()" [style.width]="width()" [style.height]="height()" class="gp-image__img gp-image-img" />

  @if (preview()) {
    <div
      class="gp-image-preview-mask"
      (click)="showPreview()"
      (keydown.enter)="showPreview()"
      (keydown.space)="$event.preventDefault(); showPreview()"
      tabindex="0"
      role="button"
      aria-label="Preview image"
    >
      <gp-icon name="eye" size="1.5em" class="gp-image-preview-icon" />
    </div>
  }

  @if (previewVisible()) {
    <div
      class="gp-image__mask gp-image-mask"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="translationService.get('aria')?.preview || 'Image Preview'"
      [style.z-index]="zIndex()"
      (click)="hidePreview()"
    >
      <div class="gp-image__toolbar gp-image-toolbar" (click)="$event.stopPropagation()">
        <button
          type="button"
          class="gp-image__action-btn gp-image-action-btn"
          (click)="zoomIn()"
          [attr.aria-label]="translationService.get('aria')?.zoomIn || 'Zoom in'"
        >
          <gp-icon name="plus" size="1em" />
        </button>
        <button
          type="button"
          class="gp-image__action-btn gp-image-action-btn"
          (click)="zoomOut()"
          [attr.aria-label]="translationService.get('aria')?.zoomOut || 'Zoom out'"
        >
          <gp-icon name="minus" size="1em" />
        </button>
        <button
          type="button"
          class="gp-image__action-btn gp-image-action-btn"
          (click)="rotateRight()"
          [attr.aria-label]="translationService.get('aria')?.rotate || 'Rotate'"
        >
          <gp-icon name="refresh" size="1em" />
        </button>
        <button
          type="button"
          class="gp-image__action-btn gp-image-action-btn"
          (click)="hidePreview()"
          [attr.aria-label]="translationService.get('close') || 'Close preview'"
        >
          <gp-icon name="times" size="1em" />
        </button>
      </div>

      <div class="gp-image__preview-container gp-image-preview-container" (click)="$event.stopPropagation()">
        <img
          [src]="previewSrc() || src()"
          [alt]="alt()"
          class="gp-image__preview-img gp-image-preview-img"
          [style.transform]="'scale(' + scale() + ') rotate(' + rotate() + 'deg)'"
        />
      </div>
    </div>
  }
</div>
