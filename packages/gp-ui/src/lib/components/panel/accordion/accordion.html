<div class="gp-accordion" [id]="id()" [class]="styleClass()" [style]="style()">
  @for (tab of tabs(); track $index) {
  <div
    class="gp-accordion__tab gp-accordion-tab"
    [class.gp-accordion__tab--active]="tab.selected()"
    [class.gp-accordion-tab-active]="tab.selected()"
    [class.gp-accordion__tab--disabled]="tab.disabled()"
    [class.gp-accordion-tab-disabled]="tab.disabled()"
  >
    <div
      class="gp-accordion__header gp-accordion-header"
      (click)="toggleTab(tab)"
      (keydown.enter)="toggleTab(tab)"
      (keydown.space)="$event.preventDefault(); toggleTab(tab)"
      role="button"
      [attr.aria-expanded]="tab.selected()"
      [attr.aria-disabled]="tab.disabled()"
      [attr.aria-label]="tab.header()"
      tabindex="0"
    >
      <gp-icon
        [name]="tab.selected() ? 'chevron-down' : 'chevron-right'"
        size="0.8em"
        class="gp-accordion__arrow gp-accordion-arrow"
      />
      <span class="gp-accordion__header-text gp-accordion-header-text">{{ tab.header() }}</span>
    </div>

    @if (tab.selected()) {
    <div class="gp-accordion__body gp-accordion-body" role="region" [attr.aria-label]="tab.header()">
      <ng-container *ngTemplateOutlet="tabContentTpl; context: { $implicit: tab }" />
    </div>
    }
  </div>
  }
  <ng-content />
</div>

<ng-template #tabContentTpl let-tab>
  <div class="gp-accordion__content gp-accordion-content">
    <!-- Render tab projected content -->
  </div>
</ng-template>
