<div class="gp-stacked-dock-shell">
  <!-- Minimal Top Header -->
  <header class="dock-topbar">
    <ng-container *ngIf="effectiveHeader; else defaultHeader">
      <ng-container *ngTemplateOutlet="effectiveHeader" />
    </ng-container>
    <ng-template #defaultHeader>
      <ng-content select="[header], [slot=header]">
        <div class="brand-title">{{ brandName() }}</div>
        <span class="active-tab-title">{{ activeTab() }}</span>
      </ng-content>
    </ng-template>
  </header>

  <!-- Full-Screen Content Area -->
  <main class="dock-main-stage">
    <ng-container *ngIf="effectiveContent; else defaultContent">
      <ng-container *ngTemplateOutlet="effectiveContent" />
    </ng-container>
    <ng-template #defaultContent>
      <ng-content select="[main], [slot=main], [content], [slot=content]">
        <ng-content />
      </ng-content>
    </ng-template>
  </main>

  <!-- Floating Mac-style Bottom Dock -->
  <footer class="bottom-dock-bar">
    <ng-container *ngIf="effectiveDock; else defaultDock">
      <ng-container *ngTemplateOutlet="effectiveDock" />
    </ng-container>
    <ng-template #defaultDock>
      <ng-content select="[dock], [slot=dock]">
        <div class="dock-pill" *ngIf="dockItems() && dockItems().length > 0">
          <button
            type="button"
            *ngFor="let item of dockItems()"
            class="dock-item"
            [class.active]="item.id === activeDockId() || item.active"
            [title]="item.title"
            (click)="dockItemClick.emit(item)"
          >
            <gp-icon [name]="item.icon" size="1.25em" />
            <span class="dock-dot" *ngIf="item.id === activeDockId() || item.active"></span>
          </button>
        </div>
      </ng-content>
    </ng-template>
  </footer>
</div>
