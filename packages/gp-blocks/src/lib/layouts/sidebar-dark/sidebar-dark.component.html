<div class="gp-sidebar-dark-shell">
  <!-- Dark Sidebar -->
  <aside class="dark-sidebar">
    <ng-container *ngIf="effectiveSidebar(); else defaultSidebar">
      <ng-container *ngTemplateOutlet="effectiveSidebar()!" />
    </ng-container>

    <ng-template #defaultSidebar>
      <ng-content select="[sidebar], [slot=sidebar]" />
        <!-- Brand Header -->
        <ng-container *ngIf="effectiveBrand(); else defaultBrand">
          <ng-container *ngTemplateOutlet="effectiveBrand()!" />
        </ng-container>
        <ng-template #defaultBrand>
          <ng-content select="[brand], [slot=brand]" />

            <div class="brand-header">
              <div class="brand-logo-mark">
                <gp-icon [name]="brandIcon()" size="1.2em" />
              </div>
              <span class="brand-text">{{ brandName() }}</span>
            </div>
          
        </ng-template>

        <!-- Nav -->
        <ng-container *ngIf="effectiveNav(); else defaultNav">
          <ng-container *ngTemplateOutlet="effectiveNav()!" />
        </ng-container>
        <ng-template #defaultNav>
          <ng-content select="[nav], [slot=nav]" />

            <nav class="sidebar-nav">
              <div class="nav-section-label" *ngIf="navGroupLabel()">{{ navGroupLabel() }}</div>
              <a
                href="javascript:void(0)"
                *ngFor="let item of navItems()"
                class="nav-item"
                [class.active]="item.id === activeNavId() || item.active"
                (click)="navItemClick.emit(item)"
              >
                <gp-icon [name]="item.icon" size="1.1em" />
                <span>{{ item.label }}</span>
                <gp-badge
                  *ngIf="item.badge"
                  [value]="item.badge"
                  [severity]="item.badgeSeverity || 'primary'"
                />
              </a>
            </nav>
          
        </ng-template>

        <!-- User Footer -->
        <ng-container *ngIf="effectiveUser(); else defaultUser">
          <ng-container *ngTemplateOutlet="effectiveUser()!" />
        </ng-container>
        <ng-template #defaultUser>
          <ng-content select="[user], [slot=user]" />


            <div class="user-footer" *ngIf="userName() || userEmail()" (click)="userClick.emit()" style="cursor: pointer;">
              <gp-avatar [label]="userName().charAt(0)" size="normal" shape="circle" />
              <div class="user-info">
                <span class="user-name">{{ userName() }}</span>
                <span class="user-role">{{ userEmail() }}</span>
              </div>
            </div>
          
        </ng-template>
      
    </ng-template>
  </aside>

  <!-- Main Shell Content -->
  <div class="main-shell">
    <header class="top-nav-bar">
      <h2 class="page-title">{{ title() }}</h2>
      <div class="top-actions">
        <ng-container *ngIf="effectiveTopActions(); else projectedTopActions">
          <ng-container *ngTemplateOutlet="effectiveTopActions()!" />
        </ng-container>
        <ng-template #projectedTopActions>
          <ng-content select="[top-actions], [slot=top-actions], [actions], [slot=actions]" />
        </ng-template>
      </div>
    </header>
    <main class="page-content-area">
      <ng-container *ngIf="effectiveContent(); else defaultContent">
        <ng-container *ngTemplateOutlet="effectiveContent()!" />
      </ng-container>
      <ng-template #defaultContent>
        <ng-content select="[main], [slot=main], [content], [slot=content]" />
          <ng-content />
      </ng-template>
    </main>
  </div>
</div>
