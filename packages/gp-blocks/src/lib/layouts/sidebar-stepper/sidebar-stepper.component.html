<div class="gp-sidebar-stepper-shell">
  <aside class="stepper-sidebar">
    <ng-container *ngIf="effectiveSidebar; else defaultSidebar">
      <ng-container *ngTemplateOutlet="effectiveSidebar" />
    </ng-container>
    <ng-template #defaultSidebar>
      <ng-content select="[sidebar], [slot=sidebar]">
        <div class="brand-badge">
          <span>{{ brandName() }}</span>
        </div>

        <div class="step-list" *ngIf="steps() && steps().length > 0">
          <div
            class="step-item"
            *ngFor="let s of steps()"
            [class.active]="s.number === currentStep()"
            [class.completed]="s.completed"
            (click)="stepClick.emit(s)"
            style="cursor: pointer;"
          >
            <div class="step-num">
              <gp-icon *ngIf="s.completed" name="check" size="0.9em" />
              <span *ngIf="!s.completed">{{ s.number }}</span>
            </div>
            <span class="step-text">{{ s.label }}</span>
          </div>
        </div>
      </ng-content>
    </ng-template>
  </aside>

  <div class="main-shell">
    <header class="top-nav-bar">
      <div class="step-header-text">
        <h2 class="step-title" *ngIf="currentStepTitle()">{{ currentStepTitle() }}</h2>
        <p class="step-subtitle" *ngIf="currentStepSubtitle()">{{ currentStepSubtitle() }}</p>
      </div>
      <div class="top-actions">
        <ng-container *ngIf="effectiveTopActions; else projectedTopActions">
          <ng-container *ngTemplateOutlet="effectiveTopActions" />
        </ng-container>
        <ng-template #projectedTopActions>
          <ng-content select="[top-actions], [slot=top-actions], [actions], [slot=actions]" />
        </ng-template>
      </div>
    </header>
    <main class="page-content-area">
      <ng-container *ngIf="effectiveContent; else defaultContent">
        <ng-container *ngTemplateOutlet="effectiveContent" />
      </ng-container>
      <ng-template #defaultContent>
        <ng-content select="[main], [slot=main], [content], [slot=content]">
          <ng-content />
        </ng-content>
      </ng-template>
    </main>
  </div>
</div>
