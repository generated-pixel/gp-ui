<div class="gp-stacked-classic-shell">
      <!-- Top Navigation Bar -->
      <header class="stacked-topbar">
        <div class="topbar-inner">
          <div class="topbar-left">
            <div class="brand-badge">
              <gp-icon name="box" size="1.1em" />
            </div>
            <span class="brand-name">{{ brandName }}</span>

            <nav class="topbar-nav">
              <a href="javascript:void(0)" class="nav-link active">Dashboard</a>
              <a href="javascript:void(0)" class="nav-link">Team</a>
              <a href="javascript:void(0)" class="nav-link">Projects</a>
              <a href="javascript:void(0)" class="nav-link">Calendar</a>
            </nav>
          </div>

          <div class="topbar-right">
            <gp-avatar [label]="userName.charAt(0)" size="normal" shape="circle" />
          </div>
        </div>
      </header>

      <!-- Constrained Centered Content Container -->
      <main class="stacked-main-container">
        <div class="page-header-row">
          <h1 class="page-title">{{ title }}</h1>
          <div class="header-actions">
            <ng-content select="[slot=header-actions]" />
          </div>
        </div>
        <div class="page-body">
          <ng-content />
        </div>
      </main>
    </div>
