<div class="gp-stacked-classic-shell">
  <!-- Top Navigation Bar -->
  <header class="stacked-topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <div class="brand-badge">
          <gp-icon [name]="brandIcon()" size="1.1em" />
        </div>
        <span class="brand-name">{{ brandName() }}</span>

        <nav class="topbar-nav" *ngIf="navItems() && navItems().length > 0">
          <a
            href="javascript:void(0)"
            *ngFor="let item of navItems()"
            class="nav-link"
            [class.active]="item.id === activeNavId() || item.active"
            (click)="navItemClick.emit(item)"
          >
            {{ item.label }}
          </a>
        </nav>
      </div>

      <div class="topbar-right" (click)="userClick.emit()" style="cursor: pointer;">
        <gp-avatar [label]="userName().charAt(0)" size="normal" shape="circle" />
      </div>
    </div>
  </header>

  <!-- Constrained Centered Content Container -->
  <main class="stacked-main-container">
    <div class="page-header-row">
      <h1 class="page-title">{{ title() }}</h1>
      <div class="header-actions">
        <ng-content select="[slot=header-actions]" />
      </div>
    </div>
    <div class="page-body">
      <ng-content />
    </div>
  </main>
</div>
