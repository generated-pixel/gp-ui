<div class="gp-stacked-classic-shell">
  <!-- Top Navigation Bar -->
  <header class="stacked-topbar">
    <ng-container *ngIf="effectiveHeader; else defaultHeader">
      <ng-container *ngTemplateOutlet="effectiveHeader" />
    </ng-container>
    <ng-template #defaultHeader>
      <ng-content select="[header], [slot=header]">
        <div class="topbar-inner">
          <div class="topbar-left">
            <div class="brand-badge">
              <gp-icon [name]="brandIcon()" size="1.1em" />
            </div>
            <span class="brand-name">{{ brandName() }}</span>

            <nav class="topbar-nav" *ngIf="navItems() && navItems().length > 0">
              <a
                href="javascript:void(0)"
                *ngFor="let item of navItems()"
                class="nav-link"
                [class.active]="item.id === activeNavId() || item.active"
                (click)="navItemClick.emit(item)"
              >
                {{ item.label }}
              </a>
            </nav>
          </div>

          <ng-container *ngIf="effectiveUser; else defaultUser">
            <ng-container *ngTemplateOutlet="effectiveUser" />
          </ng-container>
          <ng-template #defaultUser>
            <ng-content select="[user], [slot=user]">
              <div class="topbar-right" *ngIf="userName()" (click)="userClick.emit()" style="cursor: pointer;">
                <gp-avatar [label]="userName().charAt(0)" size="normal" shape="circle" />
              </div>
            </ng-content>
          </ng-template>
        </div>
      </ng-content>
    </ng-template>
  </header>

  <!-- Constrained Centered Content Container -->
  <main class="stacked-main-container">
    <div class="page-header-row" *ngIf="title() || effectiveHeaderActions">
      <h1 class="page-title">{{ title() }}</h1>
      <div class="header-actions">
        <ng-container *ngIf="effectiveHeaderActions; else projectedHeaderActions">
          <ng-container *ngTemplateOutlet="effectiveHeaderActions" />
        </ng-container>
        <ng-template #projectedHeaderActions>
          <ng-content select="[header-actions], [slot=header-actions], [actions], [slot=actions]" />
        </ng-template>
      </div>
    </div>
    <div class="page-body">
      <ng-container *ngIf="effectiveContent; else defaultContent">
        <ng-container *ngTemplateOutlet="effectiveContent" />
      </ng-container>
      <ng-template #defaultContent>
        <ng-content select="[main], [slot=main], [content], [slot=content]">
          <ng-content />
        </ng-content>
      </ng-template>
    </div>
  </main>
</div>
