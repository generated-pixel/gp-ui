<div class="gp-sidebar-header-over-shell">
      <!-- Full-Width Header Spanning Across -->
      <header class="spanning-header">
        <div class="header-brand">
          <div class="brand-sq">
            <gp-icon name="layer-group" size="1.1em" />
          </div>
          <span class="brand-name">{{ brandName }}</span>
        </div>
        <div class="header-user-badge">
          <gp-avatar [label]="userName.charAt(0)" size="normal" shape="circle" />
          <span class="user-name">{{ userName }}</span>
        </div>
      </header>

      <!-- Bottom Body Split (Sidebar + Content) -->
      <div class="spanning-body">
        <aside class="nested-sidebar">
          <nav class="nested-nav">
            <a href="javascript:void(0)" class="nav-link active">
              <gp-icon name="home" size="1.1em" />
              <span>Overview</span>
            </a>
            <a href="javascript:void(0)" class="nav-link">
              <gp-icon name="folder" size="1.1em" />
              <span>Repository</span>
            </a>
            <a href="javascript:void(0)" class="nav-link">
              <gp-icon name="users" size="1.1em" />
              <span>Collaborators</span>
            </a>
            <a href="javascript:void(0)" class="nav-link">
              <gp-icon name="sliders" size="1.1em" />
              <span>Configuration</span>
            </a>
          </nav>
        </aside>

        <main class="spanning-main">
          <ng-content />
        </main>
      </div>
    </div>
