<div class="gp-stacked-subnav-tabs-shell">
  <header class="top-nav-bar">
    <div class="brand-group">
      <gp-icon [name]="brandIcon()" size="1.2em" class="brand-ico" />
      <span class="brand-title">{{ brandName() }}</span>
    </div>
    <div class="user-badge" (click)="userClick.emit()" style="cursor: pointer;">
      <gp-avatar [label]="userName().charAt(0)" size="normal" shape="circle" />
    </div>
  </header>

  <!-- Subheader with Tab Bar & Breadcrumbs -->
  <div class="sub-nav-tabs-bar" *ngIf="tabs() && tabs().length > 0">
    <div class="tabs-inner-container">
      <div class="subnav-tabs">
        <a
          href="javascript:void(0)"
          *ngFor="let tab of tabs()"
          class="tab-item"
          [class.active]="tab.id === activeTabId() || tab.active"
          (click)="tabChange.emit(tab)"
        >
          {{ tab.label }}
        </a>
      </div>
    </div>
  </div>

  <main class="page-content-wrapper">
    <ng-content />
  </main>
</div>
