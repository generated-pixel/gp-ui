<div class="gp-sidebar-dual-shell">
  <!-- Tier 1: Primary Icon Strip -->
  <aside class="tier-primary-strip">
    <ng-container *ngIf="effectiveTier1(); else defaultTier1">
      <ng-container *ngTemplateOutlet="effectiveTier1()!" />
    </ng-container>
    <ng-template #defaultTier1>
      <ng-content select="[tier1], [slot=tier1], [primary-sidebar], [slot=primary-sidebar]" />

        <div class="strip-logo">
          <gp-icon name="layer-group" size="1.25em" />
        </div>
        <nav class="strip-nav" *ngIf="tier1Items() && tier1Items().length > 0">
          <gp-button
            type="button"
            *ngFor="let item of tier1Items()"
            variant="text"
            severity="secondary"
            [iconOnly]="true"
            styleClass="strip-btn"
            [class.active]="item.id === activeTier1Id() || item.active"
            [ariaLabel]="item.title"
            (onClickEvent)="tier1Click.emit(item)"
          >
            <gp-icon [name]="item.icon" size="1.2em" />
          </gp-button>
        </nav>
      
    </ng-template>
  </aside>

  <!-- Tier 2: Subnavigation List -->
  <aside class="tier-secondary-nav">
    <ng-container *ngIf="effectiveTier2(); else defaultTier2">
      <ng-container *ngTemplateOutlet="effectiveTier2()!" />
    </ng-container>
    <ng-template #defaultTier2>
      <ng-content select="[tier2], [slot=tier2], [secondary-sidebar], [slot=secondary-sidebar]" />

        <div class="tier-head">
          <span class="tier-title">{{ subnavTitle() }}</span>
          <gp-badge *ngIf="subnavBadge()" [value]="subnavBadge()" severity="secondary" />
        </div>
        <div class="tier-items" *ngIf="tier2Items() && tier2Items().length > 0">
          <a
            href="javascript:void(0)"
            *ngFor="let item of tier2Items()"
            class="tier-link"
            [class.active]="item.id === activeTier2Id() || item.active"
            (click)="tier2Click.emit(item)"
          >
            <span>{{ item.label }}</span>
          </a>
        </div>
      
    </ng-template>
  </aside>

  <!-- Main Content -->
  <div class="main-shell">
    <header class="top-nav-bar">
      <h2 class="page-title">{{ title() }}</h2>
      <div class="top-actions">
        <ng-container *ngIf="effectiveTopActions(); else projectedTopActions">
          <ng-container *ngTemplateOutlet="effectiveTopActions()!" />
        </ng-container>
        <ng-template #projectedTopActions>
          <ng-content select="[top-actions], [slot=top-actions], [actions], [slot=actions]" />
        </ng-template>
      </div>
    </header>
    <main class="page-content-area">
      <ng-container *ngIf="effectiveContent(); else defaultContent">
        <ng-container *ngTemplateOutlet="effectiveContent()!" />
      </ng-container>
      <ng-template #defaultContent>
        <ng-content select="[main], [slot=main], [content], [slot=content]" />
          <ng-content />
      </ng-template>
    </main>
  </div>
</div>
