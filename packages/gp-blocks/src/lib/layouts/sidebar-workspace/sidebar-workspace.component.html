<div class="gp-sidebar-workspace-shell">
      <aside class="workspace-sidebar">
        <!-- Workspace Selector Dropdown Box -->
        <div class="workspace-selector-btn">
          <div class="workspace-avatar">
            <span>{{ currentWorkspace.charAt(0) }}</span>
          </div>
          <div class="workspace-text-group">
            <span class="workspace-name">{{ currentWorkspace }}</span>
            <span class="workspace-tier">Enterprise Team</span>
          </div>
          <gp-icon name="chevron-down" size="0.85em" class="arrow-icon" />
        </div>

        <nav class="sidebar-nav">
          <a href="javascript:void(0)" class="nav-item active">
            <gp-icon name="home" size="1.1em" />
            <span>Workspace Home</span>
          </a>
          <a href="javascript:void(0)" class="nav-item">
            <gp-icon name="folder" size="1.1em" />
            <span>Projects & Repos</span>
          </a>
          <a href="javascript:void(0)" class="nav-item">
            <gp-icon name="users" size="1.1em" />
            <span>Team Members</span>
          </a>
          <a href="javascript:void(0)" class="nav-item">
            <gp-icon name="sliders" size="1.1em" />
            <span>Organization Settings</span>
          </a>
        </nav>
      </aside>

      <div class="main-shell">
        <header class="top-nav-bar">
          <h2 class="page-title">{{ title }}</h2>
          <div class="top-actions">
            <ng-content select="[slot=top-actions]" />
          </div>
        </header>
        <main class="page-content-area">
          <ng-content />
        </main>
      </div>
    </div>
