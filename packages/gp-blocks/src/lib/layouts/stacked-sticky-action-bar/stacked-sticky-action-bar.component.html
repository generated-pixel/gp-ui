<div class="gp-stacked-sticky-bar-shell">
  <header class="top-nav-bar">
    <div class="brand-group">
      <gp-icon [name]="brandIcon()" size="1.2em" />
      <span class="brand-name">{{ brandName() }}</span>
    </div>
    <nav class="nav-links" *ngIf="navLinks() && navLinks().length > 0">
      <a
        href="javascript:void(0)"
        *ngFor="let link of navLinks()"
        class="link-item"
        [class.active]="link.id === activeNavId() || link.active"
        (click)="navLinkClick.emit(link)"
      >
        {{ link.label }}
      </a>
    </nav>
  </header>

  <!-- Sticky Filter & Action Bar -->
  <div class="sticky-action-bar">
    <div class="action-bar-inner">
      <div class="bar-left">
        <h3 class="bar-title">{{ pageTitle() }}</h3>
        <gp-badge [value]="itemCount() + ' Items'" severity="secondary" />
      </div>
      <div class="bar-right">
        <div class="search-wrap">
          <gp-icon name="search" size="0.85em" class="s-ico" />
          <input
            type="text"
            [value]="searchQuery()"
            [placeholder]="searchPlaceholder()"
            (input)="onSearch($event)"
            class="s-inp"
          />
        </div>
        <gp-button severity="primary" (onClick)="addClick.emit()">
          <gp-icon name="plus" size="0.85em" style="margin-right: 0.35rem;" />
          {{ addBtnLabel() }}
        </gp-button>
      </div>
    </div>
  </div>

  <main class="page-content-area">
    <ng-content />
  </main>
</div>
