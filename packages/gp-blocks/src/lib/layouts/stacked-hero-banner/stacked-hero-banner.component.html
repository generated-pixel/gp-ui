<div class="gp-stacked-hero-shell">
  <!-- Gradient Hero Header -->
  <section class="hero-banner-section">
    <header class="hero-topbar">
      <div class="hero-brand">
        <gp-icon [name]="brandIcon()" size="1.2em" />
        <span>{{ brandName() }}</span>
      </div>
      <nav class="hero-nav" *ngIf="navLinks() && navLinks().length > 0">
        <a
          href="javascript:void(0)"
          *ngFor="let link of navLinks()"
          class="hero-link"
          [class.active]="link.active"
          (click)="navLinkClick.emit(link)"
        >
          {{ link.label }}
        </a>
      </nav>
    </header>

    <div class="hero-content">
      <div class="hero-text-wrap">
        <h1 class="hero-title">{{ heroTitle() }}</h1>
        <p class="hero-subtitle" *ngIf="heroSubtitle()">{{ heroSubtitle() }}</p>
      </div>
      <div class="hero-actions">
        <button
          *ngIf="primaryCta()"
          type="button"
          class="btn-hero-primary"
          (click)="primaryClick.emit()"
        >
          {{ primaryCta() }}
        </button>
        <button
          *ngIf="secondaryCta()"
          type="button"
          class="btn-hero-secondary"
          (click)="secondaryClick.emit()"
        >
          {{ secondaryCta() }}
        </button>
      </div>
    </div>
  </section>

  <!-- Main Body Container -->
  <main class="hero-body-content">
    <ng-content />
  </main>
</div>
