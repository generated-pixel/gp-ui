<div class="gp-stacked-hero-shell">
  <!-- Top Navigation -->
  <header class="hero-topbar">
    <ng-container *ngIf="effectiveHeader; else defaultHeader">
      <ng-container *ngTemplateOutlet="effectiveHeader" />
    </ng-container>
    <ng-template #defaultHeader>
      <ng-content select="[header], [slot=header]">
        <div class="topbar-inner">
          <div class="brand-group">
            <gp-icon [name]="brandIcon()" size="1.2em" />
            <span class="brand-name">{{ brandName() }}</span>
          </div>

          <nav class="hero-nav" *ngIf="navLinks() && navLinks().length > 0">
            <a
              href="javascript:void(0)"
              *ngFor="let link of navLinks()"
              class="hero-link"
              [class.active]="link.active"
              (click)="navLinkClick.emit(link)"
            >
              {{ link.label }}
            </a>
          </nav>
        </div>
      </ng-content>
    </ng-template>
  </header>

  <!-- Big Hero Banner -->
  <section class="hero-banner-section">
    <ng-container *ngIf="effectiveHero; else defaultHero">
      <ng-container *ngTemplateOutlet="effectiveHero" />
    </ng-container>
    <ng-template #defaultHero>
      <ng-content select="[hero], [slot=hero]">
        <div class="hero-banner-content">
          <h1 class="hero-title" *ngIf="heroTitle()">{{ heroTitle() }}</h1>
          <p class="hero-subtitle" *ngIf="heroSubtitle()">{{ heroSubtitle() }}</p>
          <div class="hero-actions" *ngIf="primaryCta() || secondaryCta()">
            <gp-button severity="primary" styleClass="btn-primary" *ngIf="primaryCta()" (onClickEvent)="primaryClick.emit()">
              {{ primaryCta() }}
            </gp-button>
            <gp-button variant="outlined" severity="secondary" styleClass="btn-secondary" *ngIf="secondaryCta()" (onClickEvent)="secondaryClick.emit()">
              {{ secondaryCta() }}
            </gp-button>
          </div>
        </div>
      </ng-content>
    </ng-template>
  </section>

  <!-- Main Body Content Card overlapping Hero -->
  <main class="hero-main-container">
    <div class="hero-content-card">
      <ng-container *ngIf="effectiveContent; else defaultContent">
        <ng-container *ngTemplateOutlet="effectiveContent" />
      </ng-container>
      <ng-template #defaultContent>
        <ng-content select="[main], [slot=main], [content], [slot=content]">
          <ng-content />
        </ng-content>
      </ng-template>
    </div>
  </main>
</div>
