<div class="gp-sidebar-offcanvas-shell">
      <!-- Offcanvas Overlay Backdrop when open -->
      <div *ngIf="sidebarOpen" class="offcanvas-backdrop" (click)="toggleSidebar()"></div>

      <!-- Offcanvas Drawer Sidebar -->
      <aside class="offcanvas-sidebar" [class.is-open]="sidebarOpen">
        <div class="offcanvas-head">
          <span class="head-title">{{ brandName }}</span>
          <button type="button" class="close-btn" (click)="toggleSidebar()">
            <gp-icon name="close" size="0.9em" />
          </button>
        </div>

        <nav class="offcanvas-nav">
          <a href="javascript:void(0)" class="nav-item active">
            <gp-icon name="home" size="1.1em" />
            <span>Dashboard</span>
          </a>
          <a href="javascript:void(0)" class="nav-item">
            <gp-icon name="layer-group" size="1.1em" />
            <span>Components</span>
          </a>
          <a href="javascript:void(0)" class="nav-item">
            <gp-icon name="sliders" size="1.1em" />
            <span>Settings</span>
          </a>
        </nav>
      </aside>

      <!-- Main Shell Area -->
      <div class="main-shell">
        <header class="top-nav-bar">
          <button type="button" class="menu-trigger-btn" (click)="toggleSidebar()" aria-label="Open sidebar">
            <gp-icon name="bars" size="1.2em" />
          </button>
          <h2 class="page-title">{{ title }}</h2>
        </header>
        <main class="page-content-area">
          <ng-content />
        </main>
      </div>
    </div>
