<div class="gp-sidebar-light-shell">
  <aside class="light-sidebar">
    <div class="brand-header">
      <div class="brand-badge">
        <gp-icon [name]="brandIcon()" size="1.2em" />
      </div>
      <span class="brand-title">{{ brandName() }}</span>
    </div>

    <nav class="sidebar-nav" *ngIf="navItems() && navItems().length > 0">
      <a
        href="javascript:void(0)"
        *ngFor="let item of navItems()"
        class="nav-item"
        [class.active]="item.id === activeNavId() || item.active"
        (click)="navItemClick.emit(item)"
      >
        <gp-icon [name]="item.icon" size="1.1em" />
        <span>{{ item.label }}</span>
        <gp-badge
          *ngIf="item.badge"
          [value]="item.badge"
          [severity]="item.badgeSeverity || 'success'"
        />
      </a>
    </nav>

    <div class="upgrade-card" *ngIf="upgradeTitle()">
      <span class="upgrade-title">{{ upgradeTitle() }}</span>
      <p class="upgrade-text" *ngIf="upgradeText()">{{ upgradeText() }}</p>
      <button type="button" class="upgrade-btn" (click)="upgradeClick.emit()">{{ upgradeBtnLabel() }}</button>
    </div>
  </aside>

  <div class="main-shell">
    <header class="top-nav-bar">
      <h2 class="page-title">{{ title() }}</h2>
      <div class="top-actions">
        <ng-content select="[slot=top-actions]" />
      </div>
    </header>
    <main class="page-content-area">
      <ng-content />
    </main>
  </div>
</div>
