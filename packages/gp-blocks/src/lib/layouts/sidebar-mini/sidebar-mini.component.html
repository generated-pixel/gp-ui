<div class="gp-sidebar-mini-shell">
      <aside class="mini-sidebar">
        <div class="mini-logo">
          <gp-icon [name]="brandIcon" size="1.25em" />
        </div>

        <nav class="mini-nav">
          <a href="javascript:void(0)" class="mini-item active" title="Dashboard">
            <gp-icon name="home" size="1.2em" />
          </a>
          <a href="javascript:void(0)" class="mini-item" title="Analytics">
            <gp-icon name="layer-group" size="1.2em" />
          </a>
          <a href="javascript:void(0)" class="mini-item" title="Projects">
            <gp-icon name="folder" size="1.2em" />
          </a>
          <a href="javascript:void(0)" class="mini-item" title="Team">
            <gp-icon name="users" size="1.2em" />
          </a>
          <a href="javascript:void(0)" class="mini-item" title="Settings">
            <gp-icon name="sliders" size="1.2em" />
          </a>
        </nav>

        <div class="mini-bottom">
          <gp-avatar [label]="userName.charAt(0)" size="normal" shape="circle" />
        </div>
      </aside>

      <div class="main-shell">
        <header class="top-nav-bar">
          <h2 class="page-title">{{ title }}</h2>
          <div class="top-actions">
            <ng-content select="[slot=top-actions]" />
          </div>
        </header>
        <main class="page-content-area">
          <ng-content />
        </main>
      </div>
    </div>
