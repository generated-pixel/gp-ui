<div class="gp-sidebar-accordion-shell">
  <aside class="accordion-sidebar">
    <div class="sidebar-brand">
      <gp-icon name="box" size="1.2em" />
      <span class="brand-text">{{ brandName() }}</span>
    </div>

    <nav class="accordion-groups" *ngIf="groups() && groups().length > 0">
      <div class="accordion-group" *ngFor="let g of groups(); let idx = index">
        <div class="group-header" (click)="toggleGroup(idx)">
          <div class="group-title-wrap">
            <gp-icon [name]="g.icon" size="1.1em" />
            <span>{{ g.title }}</span>
          </div>
          <gp-icon [name]="g.open ? 'chevron-up' : 'chevron-down'" size="0.8em" />
        </div>
        <div class="group-children" *ngIf="g.open">
          <a
            href="javascript:void(0)"
            *ngFor="let link of g.links"
            class="sub-link"
            [class.active]="link.id === activeSubLinkId() || link.active"
            (click)="linkClick.emit(link)"
          >
            {{ link.label }}
          </a>
        </div>
      </div>
    </nav>
  </aside>

  <div class="main-shell">
    <header class="top-nav-bar">
      <h2 class="page-title">{{ title() }}</h2>
      <div class="top-actions">
        <ng-content select="[slot=top-actions]" />
      </div>
    </header>
    <main class="page-content-area">
      <ng-content />
    </main>
  </div>
</div>
