<header class="gp-nav-topbar">
      <div class="nav-left">
        <div class="brand-group">
          <gp-icon name="box" size="1.2em" class="b-ico" />
          <span class="b-name">{{ brandName }}</span>
        </div>

        <nav class="desktop-links">
          <a href="javascript:void(0)" class="link-item active">Dashboard</a>
          <a href="javascript:void(0)" class="link-item">Projects</a>
          <a href="javascript:void(0)" class="link-item">Team</a>
          <a href="javascript:void(0)" class="link-item">Reports</a>
        </nav>
      </div>

      <div class="nav-right">
        <div class="search-mini">
          <gp-icon name="search" size="0.8em" class="s-ico" />
          <input type="text" placeholder="Search (Cmd+K)..." class="s-inp" />
        </div>

        <button type="button" class="icon-btn" title="Notifications">
          <gp-icon name="info-circle" size="1.1em" />
        </button>

        <div class="user-profile-menu">
          <gp-avatar [label]="userName.charAt(0)" size="normal" shape="circle" />
        </div>
      </div>
    </header>
