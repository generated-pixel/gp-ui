<header class="gp-nav-topbar">
  <div class="nav-left">
    <div class="brand-group">
      <gp-icon [name]="brandIcon()" size="1.2em" class="b-ico" />
      <span class="b-name">{{ brandName() }}</span>
    </div>

    <nav class="desktop-links" *ngIf="links() && links().length > 0">
      <a
        href="javascript:void(0)"
        *ngFor="let l of links()"
        class="link-item"
        [class.active]="l.id === activeLinkId() || l.active"
        (click)="linkClick.emit(l)"
      >
        {{ l.label }}
      </a>
    </nav>
  </div>

  <div class="nav-right">
    <div class="search-mini">
      <gp-icon name="search" size="0.8em" class="s-ico" />
      <input
        type="text"
        [value]="searchQuery()"
        [placeholder]="searchPlaceholder()"
        (input)="onSearchInput($event)"
        class="s-inp"
      />
    </div>

    <button type="button" class="icon-btn" (click)="notificationsClick.emit()" title="Notifications">
      <gp-icon name="info-circle" size="1.1em" />
    </button>

    <div class="user-profile-menu" (click)="profileClick.emit()" style="cursor: pointer;">
      <gp-avatar [label]="userName().charAt(0)" size="normal" shape="circle" />
    </div>
  </div>
</header>
