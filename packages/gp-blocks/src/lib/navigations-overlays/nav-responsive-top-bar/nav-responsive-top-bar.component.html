<header class="gp-topbar-wrapper">
  <div class="topbar-container">
    <!-- Left Section: Brand & Nav Links -->
    <div class="topbar-left">
      <ng-container *ngIf="effectiveBrand; else defaultBrand">
        <ng-container *ngTemplateOutlet="effectiveBrand" />
      </ng-container>
      <ng-template #defaultBrand>
        <ng-content select="[brand], [slot=brand]">
          <div class="brand-holder">
            <gp-icon [name]="brandIcon()" size="1.2em" />
            <span class="brand-title">{{ brandName() }}</span>
          </div>
        </ng-content>
      </ng-template>

      <ng-container *ngIf="effectiveNav; else defaultNav">
        <ng-container *ngTemplateOutlet="effectiveNav" />
      </ng-container>
      <ng-template #defaultNav>
        <ng-content select="[nav], [slot=nav], [links], [slot=links]">
          <nav class="nav-links" *ngIf="links() && links().length > 0">
            <a
              href="javascript:void(0)"
              *ngFor="let link of links()"
              class="nav-anchor"
              [class.active]="link.id === activeLinkId() || link.active"
              (click)="linkClick.emit(link)"
            >
              {{ link.label }}
            </a>
          </nav>
        </ng-content>
      </ng-template>
    </div>

    <!-- Right Section: Search, Notifications & User -->
    <div class="topbar-right">
      <ng-container *ngIf="effectiveSearch; else defaultSearch">
        <ng-container *ngTemplateOutlet="effectiveSearch" />
      </ng-container>
      <ng-template #defaultSearch>
        <ng-content select="[search], [slot=search]">
          <div class="search-wrap">
            <gp-icon name="search" size="0.9em" class="search-ico" />
            <input
              type="text"
              [value]="searchQuery()"
              [placeholder]="searchPlaceholder()"
              (input)="onSearchInput($event)"
              class="topbar-search-input"
            />
          </div>
        </ng-content>
      </ng-template>

      <button type="button" class="icon-btn" (click)="notificationsClick.emit()" title="Notifications">
        <gp-icon name="bell" size="1.1em" />
      </button>

      <ng-container *ngIf="effectiveUser; else defaultUser">
        <ng-container *ngTemplateOutlet="effectiveUser" />
      </ng-container>
      <ng-template #defaultUser>
        <ng-content select="[user], [slot=user]">
          <div class="user-avatar-btn" (click)="profileClick.emit()" style="cursor: pointer;">
            <gp-avatar [label]="(userName() || 'U').charAt(0)" size="normal" shape="circle" />
          </div>
        </ng-content>
      </ng-template>
    </div>
  </div>
  <ng-content />
</header>
