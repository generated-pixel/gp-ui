<div class="gp-slide-over-backdrop" (click)="close.emit()">
  <div class="gp-slide-panel" (click)="$event.stopPropagation()">
    <!-- Header -->
    <ng-container *ngIf="effectiveHeader; else defaultHeader">
      <ng-container *ngTemplateOutlet="effectiveHeader" />
    </ng-container>
    <ng-template #defaultHeader>
      <ng-content select="[header], [slot=header]">
        <div class="panel-head">
          <div class="head-titles" *ngIf="title()">
            <h3 class="head-title">{{ title() }}</h3>
            <p class="head-desc" *ngIf="description()">{{ description() }}</p>
          </div>
          <gp-button variant="text" severity="secondary" [iconOnly]="true" styleClass="close-btn" ariaLabel="Close panel" (onClickEvent)="close.emit()">
            <gp-icon name="close" size="1.1em" />
          </gp-button>
        </div>
      </ng-content>
    </ng-template>

    <!-- Body -->
    <div class="panel-body">
      <ng-container *ngIf="effectiveContent; else defaultContent">
        <ng-container *ngTemplateOutlet="effectiveContent" />
      </ng-container>
      <ng-template #defaultContent>
        <ng-container *ngIf="effectiveBody; else defaultBody">
          <ng-container *ngTemplateOutlet="effectiveBody" />
        </ng-container>
        <ng-template #defaultBody>
          <ng-content select="[body], [slot=body]">
            <div class="field-wrap">
              <label class="input-label">Configuration Tag</label>
              <gp-input-text
                type="text"
                styleClass="panel-input"
                [fluid]="true"
                [value]="configTag()"
                (valueChange)="configTag.set($event)"
                placeholder="tag-name"
              />
            </div>

            <div class="field-wrap">
              <label class="input-label">Worker Cluster Size (Nodes)</label>
              <gp-input-number
                styleClass="panel-input"
                [fluid]="true"
                [value]="workerNodes()"
                (onInputEvent)="workerNodes.set(+$any($event.target).value)"
                [min]="1"
                [max]="64"
              />
            </div>
          </ng-content>
        </ng-template>
        <ng-content />
      </ng-template>
    </div>

    <!-- Actions Footer -->
    <ng-container *ngIf="effectiveActions; else defaultActions">
      <ng-container *ngTemplateOutlet="effectiveActions" />
    </ng-container>
    <ng-template #defaultActions>
      <ng-content select="[actions], [slot=actions]">
        <div class="panel-foot">
          <gp-button variant="outlined" severity="secondary" size="sm" (onClickEvent)="cancel.emit()">{{ cancelBtnLabel() }}</gp-button>
          <gp-button severity="primary" size="sm" (onClickEvent)="onSave()">{{ saveBtnLabel() }}</gp-button>
        </div>
      </ng-content>
    </ng-template>
  </div>
</div>
