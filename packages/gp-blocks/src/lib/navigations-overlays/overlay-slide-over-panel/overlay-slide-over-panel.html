<div class="gp-slide-over-launcher">
  <gp-button [label]="openLabel()" icon="sliders" variant="outlined" (onClickEvent)="open()" />
</div>

<gp-drawer
  position="right"
  [header]="title()"
  [visible]="visible()"
  [dismissable]="true"
  [modal]="true"
  (visibleChange)="onVisibleChange($event)"
  (onHide)="onDrawerHide()"
>
  <div class="gp-slide-over-content">
    @if (effectiveHeader()) {
      <ng-container *ngTemplateOutlet="effectiveHeader()!" />
    } @else {
      <ng-content select="[header], [slot=header]" />

      @if (description()) {
        <p class="gp-slide-over-description">{{ description() }}</p>
      }
    }

    <div class="gp-slide-over-body">
      @if (effectiveContent()) {
        <ng-container *ngTemplateOutlet="effectiveContent()!" />
      } @else if (effectiveBody()) {
        <ng-container *ngTemplateOutlet="effectiveBody()!" />
      } @else {
        <ng-content select="[body], [slot=body]" />

        <div class="gp-slide-over-field">
          <label for="gp-slide-config-tag">Configuration Tag</label>
          <gp-input-text
            inputId="gp-slide-config-tag"
            [fluid]="true"
            [value]="configTag()"
            (onInputEvent)="configTag.set($any($event.target).value)"
            placeholder="tag-name"
          />
        </div>

        <div class="gp-slide-over-field">
          <label for="gp-slide-worker-nodes">Worker Cluster Size (Nodes)</label>
          <gp-input-number
            inputId="gp-slide-worker-nodes"
            [fluid]="true"
            [value]="workerNodes()"
            (onValueChange)="workerNodes.set($event ?? 1)"
            [min]="1"
            [max]="64"
          />
        </div>

        <ng-content />
      }
    </div>

    <div class="gp-slide-over-actions">
      @if (effectiveActions()) {
        <ng-container *ngTemplateOutlet="effectiveActions()!" />
      } @else {
        <ng-content select="[actions], [slot=actions]" />

        <gp-button [label]="cancelBtnLabel()" variant="outlined" severity="secondary" (onClickEvent)="onCancel()" />
        <gp-button [label]="saveBtnLabel()" severity="primary" (onClickEvent)="onSave()" />
      }
    </div>
  </div>
</gp-drawer>
