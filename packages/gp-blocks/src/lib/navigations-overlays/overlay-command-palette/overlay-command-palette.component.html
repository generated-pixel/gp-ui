<div class="gp-command-palette-backdrop">
      <div class="palette-modal">
        <div class="palette-input-row">
          <gp-icon name="search" size="1.1em" class="p-search-ico" />
          <input type="text" placeholder="Type a command or search documentation..." class="p-input" autofocus />
          <span class="p-esc-hint">ESC</span>
        </div>

        <div class="palette-results">
          <div class="results-group-label">Quick Actions</div>
          <div class="palette-item active">
            <gp-icon name="plus" size="1em" class="item-ico" />
            <div class="item-text">
              <span class="main-label">Create new deployment cluster</span>
              <span class="sub-label">Launch an AMD64 Kubernetes cluster</span>
            </div>
            <span class="item-shortcut">&crarr;</span>
          </div>

          <div class="palette-item">
            <gp-icon name="user" size="1em" class="item-ico" />
            <div class="item-text">
              <span class="main-label">Invite team member</span>
              <span class="sub-label">Send email invitation and assign roles</span>
            </div>
          </div>

          <div class="palette-item">
            <gp-icon name="sliders" size="1em" class="item-ico" />
            <div class="item-text">
              <span class="main-label">Go to Billing & Invoices</span>
              <span class="sub-label">View payment receipts and statements</span>
            </div>
          </div>
        </div>
      </div>
    </div>
