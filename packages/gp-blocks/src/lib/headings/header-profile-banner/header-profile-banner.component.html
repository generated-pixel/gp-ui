<div class="gp-profile-banner-header">
  <div class="banner-gradient">
    <ng-container *ngIf="effectiveBanner(); else defaultBanner">
      <ng-container *ngTemplateOutlet="effectiveBanner()!" />
    </ng-container>
    <ng-template #defaultBanner>
      <ng-content select="[banner], [slot=banner]" />
    </ng-template>
  </div>

  <div class="profile-info-bar">
    <ng-container *ngIf="effectiveProfile(); else defaultProfile">
      <ng-container *ngTemplateOutlet="effectiveProfile()!" />
    </ng-container>
    <ng-template #defaultProfile>
      <ng-content select="[profile], [slot=profile]" />

        <div class="profile-left">
          <div class="avatar-holder">
            <gp-avatar [label]="(userName() || 'U').charAt(0)" size="xlarge" shape="circle" />
          </div>
          <div class="text-meta">
            <div class="name-status-row">
              <h2 class="user-name">{{ userName() }}</h2>
              <gp-badge *ngIf="statusText()" [value]="statusText()" [severity]="statusSeverity()" />
            </div>
            <div class="title-loc-row">
              <span class="user-title" *ngIf="userTitle()">{{ userTitle() }}</span>
              <span class="dot" *ngIf="location() && userTitle()">&bull;</span>
              <span class="user-loc" *ngIf="location()">
                <gp-icon name="map-pin" size="0.85em" />
                {{ location() }}
              </span>
            </div>
          </div>
        </div>
      
    </ng-template>

    <div class="profile-actions">
      <ng-container *ngIf="effectiveActions(); else defaultActions">
        <ng-container *ngTemplateOutlet="effectiveActions()!" />
      </ng-container>
      <ng-template #defaultActions>
        <ng-content select="[actions], [slot=actions]" />

          <gp-button variant="outlined" severity="secondary" size="sm" (onClickEvent)="messageClick.emit()">
            <gp-icon name="message-square" size="0.85em" style="margin-right: 0.35rem;" />
            {{ messageBtnLabel() }}
          </gp-button>
          <gp-button severity="primary" size="sm" (onClickEvent)="connectClick.emit()">
            <gp-icon name="user-plus" size="0.85em" style="margin-right: 0.35rem;" />
            {{ connectBtnLabel() }}
          </gp-button>
        
      </ng-template>
    </div>
  </div>
  <ng-content />
</div>
