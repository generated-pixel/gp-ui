<div class="gp-page-header-card">
      <div class="breadcrumb-trail">
        <span>Workspace</span>
        <span class="sep">/</span>
        <span>Clusters</span>
        <span class="sep">/</span>
        <span class="current">{{ title }}</span>
      </div>

      <div class="header-main-bar">
        <div class="title-group">
          <div class="title-with-badge">
            <h1 class="page-title">{{ title }}</h1>
            <gp-badge [value]="badgeText" severity="success" />
          </div>
          <p class="page-desc">{{ description }}</p>
        </div>

        <div class="actions-group">
          <gp-button variant="outlined" severity="secondary">
            <gp-icon name="download" size="0.85em" style="margin-right: 0.35rem;" />
            Export
          </gp-button>
          <gp-button severity="primary">
            <gp-icon name="plus" size="0.85em" style="margin-right: 0.35rem;" />
            Deploy Service
          </gp-button>
        </div>
      </div>
    </div>
