<div class="gp-header-search-filters-card">
  <div class="top-row">
    <div>
      <h2 class="title">{{ title() }}</h2>
      <p class="subtitle" *ngIf="subtitle()">{{ subtitle() }}</p>
    </div>
    <gp-button severity="primary" (onClick)="createClick.emit()">
      <gp-icon name="plus" size="0.85em" style="margin-right: 0.35rem;" />
      {{ createBtnLabel() }}
    </gp-button>
  </div>

  <!-- Filters and Search Toolbar -->
  <div class="filters-toolbar">
    <div class="search-input-box">
      <gp-icon name="search" size="0.85em" class="s-ico" />
      <input
        type="text"
        [value]="searchQuery()"
        [placeholder]="searchPlaceholder()"
        (input)="onSearchInput($event)"
        class="s-inp"
      />
    </div>

    <div class="filter-dropdowns">
      <select
        class="custom-select"
        *ngFor="let g of filterGroups()"
        [value]="g.selectedValue || g.options[0]?.value"
        (change)="onSelectChange(g.id, $event)"
      >
        <option *ngFor="let opt of g.options" [value]="opt.value">{{ opt.label }}</option>
      </select>

      <gp-button variant="outlined" severity="secondary" (onClick)="moreFiltersClick.emit()">
        <gp-icon name="filter" size="0.85em" style="margin-right: 0.35rem;" />
        More Filters
      </gp-button>
    </div>
  </div>
</div>
