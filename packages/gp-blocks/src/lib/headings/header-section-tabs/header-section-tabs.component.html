<div class="gp-section-tabs-header">
  <div class="header-top-row">
    <ng-container *ngIf="effectiveTitle; else defaultTitle">
      <ng-container *ngTemplateOutlet="effectiveTitle" />
    </ng-container>
    <ng-template #defaultTitle>
      <ng-content select="[title], [slot=title]">
        <div class="header-titles">
          <h3 class="section-title">{{ title() }}</h3>
          <p class="section-desc" *ngIf="description()">{{ description() }}</p>
        </div>
      </ng-content>
    </ng-template>

    <div class="header-actions">
      <ng-container *ngIf="effectiveActions; else defaultActions">
        <ng-container *ngTemplateOutlet="effectiveActions" />
      </ng-container>
      <ng-template #defaultActions>
        <ng-content select="[actions], [slot=actions]">
          <gp-button severity="primary" size="sm" (onClick)="actionClick.emit()">
            <gp-icon name="plus" size="0.85em" style="margin-right: 0.35rem;" />
            {{ actionBtnLabel() }}
          </gp-button>
        </ng-content>
      </ng-template>
    </div>
  </div>

  <div class="tabs-nav-bar">
    <ng-container *ngIf="effectiveTabs; else defaultTabs">
      <ng-container *ngTemplateOutlet="effectiveTabs" />
    </ng-container>
    <ng-template #defaultTabs>
      <ng-content select="[tabs], [slot=tabs]">
        <div class="tabs-list" *ngIf="tabs() && tabs().length > 0">
          <button
            type="button"
            *ngFor="let t of tabs()"
            class="tab-link"
            [class.active]="t.id === activeTabId() || t.active"
            (click)="onTabClick(t)"
          >
            <span>{{ t.label }}</span>
            <gp-badge
              *ngIf="t.count !== undefined"
              [value]="t.count"
              [severity]="t.badgeSeverity || (t.id === activeTabId() || t.active ? 'primary' : 'secondary')"
            />
          </button>
        </div>
      </ng-content>
    </ng-template>
  </div>
  <ng-content />
</div>
