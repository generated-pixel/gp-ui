<div class="gp-header-compact">
  <div class="left-actions">
    <ng-container *ngIf="effectiveBreadcrumbs; else defaultBreadcrumbs">
      <ng-container *ngTemplateOutlet="effectiveBreadcrumbs" />
    </ng-container>
    <ng-template #defaultBreadcrumbs>
      <ng-content select="[breadcrumbs], [slot=breadcrumbs]" />

        <gp-button variant="text" severity="secondary" size="sm" styleClass="back-btn" (onClickEvent)="backClick.emit()">
          <gp-icon name="arrow-left" size="0.9em" />
          <span>{{ backLabel() }}</span>
        </gp-button>
        <span class="sep" *ngIf="activeItem()">/</span>
        <span class="active-crumb" *ngIf="activeItem()">{{ activeItem() }}</span>
      
    </ng-template>
  </div>

  <div class="right-actions">
    <ng-container *ngIf="effectiveActions; else defaultActions">
      <ng-container *ngTemplateOutlet="effectiveActions" />
    </ng-container>
    <ng-template #defaultActions>
      <ng-content select="[actions], [slot=actions]" />

        <gp-button variant="outlined" severity="secondary" size="sm" (onClickEvent)="shareClick.emit()">
          <gp-icon name="share-2" size="0.85em" style="margin-right: 0.35rem;" />
          {{ shareBtnLabel() }}
        </gp-button>
        <gp-button severity="primary" size="sm" (onClickEvent)="editClick.emit()">
          <gp-icon name="edit" size="0.85em" style="margin-right: 0.35rem;" />
          {{ editBtnLabel() }}
        </gp-button>
      
    </ng-template>
  </div>
  <ng-content />
</div>
