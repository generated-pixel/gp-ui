<div class="gp-header-stats-card">
      <div class="header-left">
        <h1 class="header-title">{{ title }}</h1>
        <p class="header-desc">{{ description }}</p>
      </div>

      <div class="header-right-stats">
        <div class="stat-pill">
          <span class="p-label">Conversion Rate</span>
          <span class="p-val">4.82%</span>
        </div>
        <div class="stat-pill">
          <span class="p-label">Avg Cycle</span>
          <span class="p-val">18 Days</span>
        </div>
        <div class="stat-pill">
          <span class="p-label">Win Rate</span>
          <span class="p-val">68.4%</span>
        </div>
      </div>
    </div>
