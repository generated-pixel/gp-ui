<div class="gp-header-stats-card">
  <div class="header-left">
    <h1 class="header-title">{{ title() }}</h1>
    <p class="header-desc" *ngIf="description()">{{ description() }}</p>
  </div>

  <div class="header-right-stats" *ngIf="stats() && stats().length > 0">
    <div
      class="stat-pill"
      *ngFor="let s of stats()"
      (click)="statClick.emit(s)"
      style="cursor: pointer;"
    >
      <span class="p-label">{{ s.label }}</span>
      <span class="p-val">{{ s.value }}</span>
    </div>
  </div>
</div>
