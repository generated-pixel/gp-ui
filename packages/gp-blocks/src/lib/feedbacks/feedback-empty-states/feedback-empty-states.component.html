<div class="gp-empty-state-card">
  <div class="empty-icon-circle">
    <gp-icon [name]="icon()" size="2.5em" />
  </div>
  <h3 class="empty-title">{{ title() }}</h3>
  <p class="empty-desc" *ngIf="description()">{{ description() }}</p>
  <div class="empty-actions">
    <gp-button *ngIf="secondaryCta()" variant="outlined" severity="secondary" (onClick)="secondaryClick.emit()">
      {{ secondaryCta() }}
    </gp-button>
    <gp-button *ngIf="primaryCta()" severity="primary" (onClick)="primaryClick.emit()">
      <gp-icon name="plus" size="0.85em" style="margin-right: 0.35rem;" />
      {{ primaryCta() }}
    </gp-button>
  </div>
</div>
