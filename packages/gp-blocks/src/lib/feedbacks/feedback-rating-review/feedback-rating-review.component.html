<div class="gp-rating-review-card">
  <!-- Header -->
  <ng-container *ngIf="effectiveHeader; else defaultHeader">
    <ng-container *ngTemplateOutlet="effectiveHeader" />
  </ng-container>
  <ng-template #defaultHeader>
    <ng-content select="[header], [slot=header]">
      <div class="card-head" *ngIf="title()">
        <h3 class="head-title">{{ title() }}</h3>
        <p class="head-subtitle" *ngIf="subtitle()">{{ subtitle() }}</p>
      </div>
    </ng-content>
  </ng-template>

  <!-- Content Override or Stars Rating Body -->
  <ng-container *ngIf="effectiveContent; else defaultContent">
    <ng-container *ngTemplateOutlet="effectiveContent" />
  </ng-container>
  <ng-template #defaultContent>
    <ng-container *ngIf="effectiveStars; else defaultStars">
      <ng-container *ngTemplateOutlet="effectiveStars" />
    </ng-container>
    <ng-template #defaultStars>
      <ng-content select="[stars], [slot=stars], [rating], [slot=rating]">
        <div class="stars-picker">
          <button
            type="button"
            *ngFor="let s of [1,2,3,4,5]"
            class="star-item"
            [class.active]="s <= rating()"
            (click)="rating.set(s)"
            [title]="s + ' stars'"
          >
            <gp-icon name="star" size="1.5em" />
          </button>
        </div>
      </ng-content>
    </ng-template>

    <!-- Footer Actions -->
    <ng-container *ngIf="effectiveActions; else defaultActions">
      <ng-container *ngTemplateOutlet="effectiveActions" />
    </ng-container>
    <ng-template #defaultActions>
      <ng-content select="[actions], [slot=actions]">
        <div class="card-actions">
          <gp-button variant="outlined" severity="secondary" size="sm" (onClick)="dismiss.emit()">{{ dismissBtnLabel() }}</gp-button>
          <gp-button severity="primary" size="sm" (onClick)="submitRating.emit(rating())">{{ submitBtnLabel() }}</gp-button>
        </div>
      </ng-content>
    </ng-template>
    <ng-content />
  </ng-template>
</div>
