<div class="gp-toast-status-stack">
  <ng-container *ngIf="effectiveContent; else defaultContent">
    <ng-container *ngTemplateOutlet="effectiveContent" />
  </ng-container>
  <ng-template #defaultContent>
    <ng-content select="[toasts], [slot=toasts]">
      <ng-container *ngFor="let t of toasts()">
        <ng-container *ngIf="effectiveToastTemplate; else defaultToast">
          <ng-container *ngTemplateOutlet="effectiveToastTemplate; context: { $implicit: t }" />
        </ng-container>
        <ng-template #defaultToast>
          <div class="toast-card" [ngClass]="'severity-' + t.severity">
            <div class="toast-ico">
              <gp-icon [name]="t.icon || (t.severity === 'success' ? 'check-circle' : (t.severity === 'danger' ? 'alert-octagon' : 'info'))" size="1.2em" />
            </div>
            <div class="toast-text">
              <h4 class="toast-title">{{ t.title }}</h4>
              <p class="toast-desc">{{ t.desc }}</p>
            </div>
            <button type="button" class="close-toast-btn" (click)="closeToast.emit(t)" aria-label="Close notification">
              <gp-icon name="close" size="0.85em" />
            </button>
          </div>
        </ng-template>
      </ng-container>
    </ng-content>
  </ng-template>
  <ng-content />
</div>
