<div class="gp-toast-status-stack">
      <!-- Toast 1: Success -->
      <div class="toast-card toast-success">
        <div class="t-ico"><gp-icon name="check-circle" size="1.2em" /></div>
        <div class="t-body">
          <span class="t-title">Changes Saved</span>
          <span class="t-desc">Your profile settings have been synchronized.</span>
        </div>
        <button type="button" class="t-close"><gp-icon name="close" size="0.8em" /></button>
      </div>

      <!-- Toast 2: Information -->
      <div class="toast-card toast-info">
        <div class="t-ico"><gp-icon name="info-circle" size="1.2em" /></div>
        <div class="t-body">
          <span class="t-title">New Build Available</span>
          <span class="t-desc">Version 0.2.1 is available for staging testing.</span>
        </div>
        <button type="button" class="t-close"><gp-icon name="close" size="0.8em" /></button>
      </div>
    </div>
