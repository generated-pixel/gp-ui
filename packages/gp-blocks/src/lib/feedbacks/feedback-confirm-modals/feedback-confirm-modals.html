<div class="gp-confirm-modal-shell">
  <div class="modal-card">
    @if (effectiveContent()) {
      <ng-container *ngTemplateOutlet="effectiveContent()!" />
    } @else {
      <div class="modal-body-content">
        <!-- Icon Top -->
        @if (effectiveIcon()) {
          <ng-container *ngTemplateOutlet="effectiveIcon()!" />
        } @else {
          <ng-content select="[icon], [slot=icon]" />
          <div class="modal-icon-circle" [ngClass]="iconSeverity()">
            <gp-icon [name]="icon()" size="1.25em" />
          </div>
        }
        <!-- Message Body -->
        @if (effectiveBody()) {
          <ng-container *ngTemplateOutlet="effectiveBody()!" />
        } @else {
          <ng-content select="[body], [slot=body], [message], [slot=message]" />
          @if (title()) {
            <h3 class="modal-title">{{ title() }}</h3>
          }
          @if (message()) {
            <p class="modal-msg">{{ message() }}</p>
          }
        }
      </div>
      <!-- Action Buttons -->
      @if (effectiveActions()) {
        <ng-container *ngTemplateOutlet="effectiveActions()!" />
      } @else {
        <ng-content select="[actions], [slot=actions]" />
        <div class="modal-actions-row">
          <gp-button variant="outlined" severity="secondary" (onClickEvent)="cancel.emit()">{{
            cancelBtnLabel()
          }}</gp-button>
          <gp-button [severity]="confirmSeverity()" (onClickEvent)="confirm.emit()">{{ confirmBtnLabel() }}</gp-button>
        </div>
      }
      <ng-content />
    }
  </div>
</div>
