<div class="gp-confirm-modal-mock">
      <div class="modal-dialog-box">
        <div class="dialog-icon-col danger">
          <gp-icon name="exclamation-triangle" size="1.4em" />
        </div>
        <div class="dialog-body">
          <h3 class="dialog-title">{{ title }}</h3>
          <p class="dialog-message">{{ message }}</p>

          <div class="dialog-actions">
            <gp-button variant="outlined" severity="secondary">Cancel</gp-button>
            <gp-button severity="danger">Permanently Delete</gp-button>
          </div>
        </div>
      </div>
    </div>
