<div class="gp-checkout-payment-card">
  <!-- Top Header Row -->
  <ng-container *ngIf="effectiveHeader; else defaultHeader">
    <ng-container *ngTemplateOutlet="effectiveHeader" />
  </ng-container>
  <ng-template #defaultHeader>
    <ng-content select="[header], [slot=header]">
      <div class="card-head">
        <div class="head-titles" *ngIf="title()">
          <h3 class="head-title">{{ title() }}</h3>
          <p class="head-subtitle" *ngIf="subtitle()">{{ subtitle() }}</p>
        </div>
        <div class="security-pill" *ngIf="securityBadgeText()">
          <gp-icon name="lock" size="0.85em" />
          <span>{{ securityBadgeText() }}</span>
        </div>
      </div>
    </ng-content>
  </ng-template>

  <!-- Payment Form Body -->
  <ng-container *ngIf="effectiveContent; else defaultContent">
    <ng-container *ngTemplateOutlet="effectiveContent" />
  </ng-container>
  <ng-template #defaultContent>
    <ng-content select="[form], [slot=form]">
      <div class="payment-form-body">
        <div class="field-wrap">
          <label class="input-label">Cardholder Name</label>
          <input
            type="text"
            class="form-input"
            [value]="cardholderName()"
            (input)="cardholderName.set($any($event.target).value)"
            placeholder="Name on card"
          />
        </div>

        <div class="field-wrap">
          <label class="input-label">Card Number</label>
          <div class="card-num-box">
            <gp-icon name="credit-card" size="1.1em" class="card-ico" />
            <input
              type="text"
              class="form-input with-ico"
              [value]="cardNumber()"
              (input)="cardNumber.set($any($event.target).value)"
              placeholder="0000 0000 0000 0000"
            />
          </div>
        </div>

        <div class="split-row">
          <div class="field-wrap">
            <label class="input-label">Expiration Date</label>
            <input
              type="text"
              class="form-input"
              [value]="expiration()"
              (input)="expiration.set($any($event.target).value)"
              placeholder="MM/YY"
            />
          </div>
          <div class="field-wrap">
            <label class="input-label">CVC / CVV</label>
            <input
              type="password"
              class="form-input"
              [value]="cvc()"
              (input)="cvc.set($any($event.target).value)"
              placeholder="123"
              maxlength="4"
            />
          </div>
        </div>

        <div class="pay-btn-wrap">
          <gp-button severity="primary" [style]="{ width: '100%' }" (onClick)="onPay()">
            <gp-icon name="lock" size="0.9em" style="margin-right: 0.35rem;" />
            {{ payBtnLabel() }} <span *ngIf="amount()">({{ amount() }})</span>
          </gp-button>
        </div>
      </div>
    </ng-content>
  </ng-template>
  <ng-content />
</div>
