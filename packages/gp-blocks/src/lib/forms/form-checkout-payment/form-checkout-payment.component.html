<div class="gp-checkout-payment-card">
      <div class="chk-head">
        <h2 class="title">{{ title }}</h2>
        <p class="subtitle">{{ subtitle }}</p>
      </div>

      <div class="chk-fields">
        <div class="col-12">
          <label class="lbl">Cardholder Name</label>
          <gp-input-text placeholder="Alex Morgan" class="full-width-control" />
        </div>
        <div class="col-12">
          <label class="lbl">Card Number</label>
          <gp-input-text placeholder="4000 1234 5678 9010" class="full-width-control" />
        </div>
        <div class="col-6">
          <label class="lbl">Expiration (MM/YY)</label>
          <gp-input-text placeholder="12/28" class="full-width-control" />
        </div>
        <div class="col-6">
          <label class="lbl">CVC Code</label>
          <gp-input-text placeholder="321" class="full-width-control" />
        </div>
      </div>

      <div class="chk-footer">
        <div class="ssl-badge">
          <gp-icon name="lock" size="0.85em" />
          <span>256-Bit SSL Encrypted & Secure</span>
        </div>
        <gp-button severity="success">
          Pay $499.00 Now
        </gp-button>
      </div>
    </div>
