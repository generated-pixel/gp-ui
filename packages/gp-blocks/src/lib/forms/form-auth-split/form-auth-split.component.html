<div class="gp-auth-split-card">
  <div class="auth-left-brand-panel">
    <div class="brand-top">
      <gp-icon [name]="brandIcon()" size="1.4em" />
      <span>{{ brandName() }}</span>
    </div>
    <div class="brand-hero">
      <h2>{{ heroTitle() }}</h2>
      <p>{{ heroDesc() }}</p>
    </div>
    <div class="brand-footer">
      <span>&copy; 2026 {{ brandName() }}</span>
    </div>
  </div>

  <div class="auth-right-form-panel">
    <div class="form-wrapper">
      <h2 class="auth-title">{{ formTitle() }}</h2>
      <p class="auth-subtitle">{{ formSubtitle() }}</p>

      <form class="auth-form-body" (submit)="$event.preventDefault(); onSubmit()">
        <div class="form-group">
          <label class="lbl">Email address</label>
          <input
            type="email"
            class="form-inp"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            placeholder="you@company.com"
          />
        </div>

        <div class="form-group">
          <div class="label-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
            <label class="lbl" style="margin-bottom: 0;">Password</label>
            <a href="javascript:void(0)" class="forgot-link" (click)="forgotPasswordClick.emit()" style="font-size: 0.85em; color: var(--gp-primary-500, #3b82f6); text-decoration: none;">Forgot password?</a>
          </div>
          <input
            type="password"
            class="form-inp"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            placeholder="••••••••"
          />
        </div>

        <div class="form-group-remember" style="display: flex; align-items: center; gap: 0.5rem; margin: 0.75rem 0;">
          <input
            type="checkbox"
            id="rememberMeCheck"
            [checked]="rememberMe()"
            (change)="rememberMe.set($any($event.target).checked)"
          />
          <label for="rememberMeCheck" style="font-size: 0.85em; cursor: pointer; color: var(--gp-text-color-secondary, #64748b);">Remember this device for 30 days</label>
        </div>

        <gp-button severity="primary" class="full-width-control" (onClick)="onSubmit()">
          {{ submitBtnLabel() }}
        </gp-button>
      </form>
    </div>
  </div>
</div>
