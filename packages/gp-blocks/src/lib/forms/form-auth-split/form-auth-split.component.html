<div class="gp-auth-split-card">
      <div class="auth-left-brand-panel">
        <div class="brand-top">
          <gp-icon name="box" size="1.4em" />
          <span>{{ brandName }}</span>
        </div>
        <div class="brand-hero">
          <h2>Enterprise Security & Performance</h2>
          <p>Sign in to access your high-availability cloud infrastructure workspace.</p>
        </div>
        <div class="brand-footer">
          <span>&copy; 2026 Generated Pixel</span>
        </div>
      </div>

      <div class="auth-right-form-panel">
        <div class="form-wrapper">
          <h2 class="auth-title">Welcome back</h2>
          <p class="auth-subtitle">Please enter your credentials to log in.</p>

          <form class="auth-form-body">
            <div class="form-group">
              <label class="lbl">Email address</label>
              <gp-input-text placeholder="you@company.com" class="full-width-control" />
            </div>

            <div class="form-group">
              <div class="label-row">
                <label class="lbl">Password</label>
                <a href="javascript:void(0)" class="forgot-link">Forgot password?</a>
              </div>
              <gp-password placeholder="••••••••" class="full-width-control" />
            </div>

            <div class="form-group-remember">
              <gp-checkbox label="Remember this device for 30 days" />
            </div>

            <gp-button severity="primary" class="full-width-control">
              Sign In to Account
            </gp-button>
          </form>
        </div>
      </div>
    </div>
