<div class="gp-form-user-profile-card">
  <!-- Header -->
  <ng-container *ngIf="effectiveHeader; else defaultHeader">
    <ng-container *ngTemplateOutlet="effectiveHeader" />
  </ng-container>
  <ng-template #defaultHeader>
    <ng-content select="[header], [slot=header]">
      <div class="form-head" *ngIf="title()">
        <h3 class="head-title">{{ title() }}</h3>
        <p class="head-subtitle" *ngIf="subtitle()">{{ subtitle() }}</p>
      </div>
    </ng-content>
  </ng-template>

  <!-- Form Body -->
  <ng-container *ngIf="effectiveContent; else defaultContent">
    <ng-container *ngTemplateOutlet="effectiveContent" />
  </ng-container>
  <ng-template #defaultContent>
    <ng-content select="[content], [slot=content]">
      <ng-container *ngIf="effectiveForm; else defaultForm">
        <ng-container *ngTemplateOutlet="effectiveForm" />
      </ng-container>
      <ng-template #defaultForm>
        <ng-content select="[form], [slot=form]">
          <div class="form-grid">
            <div class="col-6">
              <label class="input-label">First Name</label>
              <input
                type="text"
                class="form-input"
                [value]="firstName()"
                (input)="firstName.set($any($event.target).value)"
                placeholder="First name"
              />
            </div>
            <div class="col-6">
              <label class="input-label">Last Name</label>
              <input
                type="text"
                class="form-input"
                [value]="lastName()"
                (input)="lastName.set($any($event.target).value)"
                placeholder="Last name"
              />
            </div>
            <div class="col-6">
              <label class="input-label">Email Address</label>
              <input
                type="email"
                class="form-input"
                [value]="email()"
                (input)="email.set($any($event.target).value)"
                placeholder="name@company.com"
              />
            </div>
            <div class="col-6">
              <label class="input-label">Phone Number</label>
              <input
                type="tel"
                class="form-input"
                [value]="phone()"
                (input)="phone.set($any($event.target).value)"
                placeholder="+1 (555) 000-0000"
              />
            </div>
            <div class="col-12">
              <label class="input-label">Biography</label>
              <textarea
                class="form-input textarea"
                rows="3"
                [value]="bio()"
                (input)="bio.set($any($event.target).value)"
                placeholder="Brief personal background..."
              ></textarea>
            </div>
          </div>
        </ng-content>
      </ng-template>

      <!-- Footer Actions -->
      <ng-container *ngIf="effectiveFooterActions; else defaultFooter">
        <ng-container *ngTemplateOutlet="effectiveFooterActions" />
      </ng-container>
      <ng-template #defaultFooter>
        <ng-content select="[footer], [slot=footer], [actions], [slot=actions]">
          <div class="form-actions">
            <gp-button variant="outlined" severity="secondary" size="sm" (onClick)="cancel.emit()">{{ cancelBtnLabel() }}</gp-button>
            <gp-button severity="primary" size="sm" (onClick)="onSave()">{{ saveBtnLabel() }}</gp-button>
          </div>
        </ng-content>
      </ng-template>
      <ng-content />
    </ng-content>
  </ng-template>
</div>
