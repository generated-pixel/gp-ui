<div class="gp-stats-counter-strip">
  <ng-container *ngIf="effectiveContent; else defaultContent">
    <ng-container *ngTemplateOutlet="effectiveContent" />
  </ng-container>
  <ng-template #defaultContent>
    <ng-content select="[counters], [slot=counters]" />

      <ng-container *ngFor="let c of counters()">
        <ng-container *ngIf="effectiveCounterTemplate; else defaultCounter">
          <ng-container *ngTemplateOutlet="effectiveCounterTemplate; context: { $implicit: c }" />
        </ng-container>
        <ng-template #defaultCounter>
          <div
            class="counter-col"
            (click)="counterClick.emit(c)"
            style="cursor: pointer;"
          >
            <span class="counter-num">{{ c.number }}</span>
            <span class="counter-label">{{ c.label }}</span>
            <p class="counter-desc" *ngIf="c.desc">{{ c.desc }}</p>
          </div>
        </ng-template>
      </ng-container>
    
  </ng-template>
  <ng-content />
</div>
