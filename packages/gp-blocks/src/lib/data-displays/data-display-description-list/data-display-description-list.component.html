<div class="gp-description-list-card">
  <!-- Header -->
  <ng-container *ngIf="effectiveHeader; else defaultHeader">
    <ng-container *ngTemplateOutlet="effectiveHeader" />
  </ng-container>
  <ng-template #defaultHeader>
    <ng-content select="[header], [slot=header]" />

      <div class="card-head" *ngIf="title()">
        <h3 class="head-title">{{ title() }}</h3>
        <p class="head-subtitle" *ngIf="subtitle()">{{ subtitle() }}</p>
      </div>
    
  </ng-template>

  <!-- Items Body -->
  <ng-container *ngIf="effectiveContent; else defaultContent">
    <ng-container *ngTemplateOutlet="effectiveContent" />
  </ng-container>
  <ng-template #defaultContent>
    <ng-content select="[items], [slot=items]" />

      <div class="desc-grid" *ngIf="items() && items().length > 0">
        <ng-container *ngFor="let item of items()">
          <ng-container *ngIf="effectiveItemTemplate; else defaultItem">
            <ng-container *ngTemplateOutlet="effectiveItemTemplate; context: { $implicit: item }" />
          </ng-container>
          <ng-template #defaultItem>
            <div
              class="desc-row"
              (click)="itemClick.emit(item)"
              style="cursor: pointer;"
            >
              <span class="desc-label">{{ item.label }}</span>
              <span class="desc-value" *ngIf="!item.badge">{{ item.value }}</span>
              <gp-badge *ngIf="item.badge" [value]="item.value" [severity]="item.badgeSeverity || 'secondary'" />
            </div>
          </ng-template>
        </ng-container>
      </div>
    
  </ng-template>
  <ng-content />
</div>
