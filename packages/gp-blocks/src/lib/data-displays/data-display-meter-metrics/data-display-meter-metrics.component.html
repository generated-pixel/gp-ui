<div class="gp-meter-metrics-card">
      <div class="card-head">
        <h3 class="title">{{ title }}</h3>
        <p class="subtitle">{{ subtitle }}</p>
      </div>

      <div class="meters-list">
        <div class="meter-item" *ngFor="let m of meters">
          <div class="meter-info">
            <span class="m-label">{{ m.label }}</span>
            <span class="m-value">{{ m.current }} / {{ m.max }} ({{ m.pct }}%)</span>
          </div>
          <gp-progress-bar [value]="m.pct" [showValue]="false" />
        </div>
      </div>
    </div>
