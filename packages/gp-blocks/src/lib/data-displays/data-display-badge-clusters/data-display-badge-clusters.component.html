<div class="gp-badge-clusters-card">
  <h3 class="title">{{ title() }}</h3>
  <p class="subtitle" *ngIf="subtitle()">{{ subtitle() }}</p>

  <div class="cluster-sections" *ngIf="groups() && groups().length > 0">
    <div class="section-group" *ngFor="let g of groups()">
      <span class="group-title">{{ g.title }}</span>
      <div class="tag-row">
        <ng-container *ngFor="let item of g.items">
          <span class="interactive-tag-wrap" (click)="itemClick.emit(item)">
            <gp-tag
              *ngIf="item.isTag"
              [value]="item.value"
              [severity]="item.severity || 'primary'"
            />
            <gp-badge
              *ngIf="!item.isTag"
              [value]="item.value"
              [severity]="item.severity || 'primary'"
            />
          </span>
        </ng-container>
      </div>
    </div>
  </div>
</div>
