<div class="gp-dashboard-ecom-root">
  <!-- Optional Top Action Bar / Slot -->
  <div class="dashboard-top-slot" *ngIf="contentHeaderActions()">
    <ng-container *ngTemplateOutlet="contentHeaderActions()!" />
  </div>
  <ng-content select="[actions], [slot=actions]" />

  <!-- Drag-and-Drop Grid Canvas -->
  <gp-grid
    [(items)]="widgets"
    [columns]="gridColumns()"
    [rowHeight]="gridRowHeight()"
    [gap]="gridGap()"
    [compactType]="gridCompactType()"
    [readonly]="gridReadonly()"
    (layoutChanged)="onLayoutChanged($event)"
  >
    <ng-template #widgetTemplate let-item>
      <!-- Custom User-Defined Template per Item or Widget Slot -->
      <ng-container *ngIf="effectiveWidgetTemplate(); else defaultWidgetRender">
        <ng-container *ngTemplateOutlet="effectiveWidgetTemplate()!; context: { $implicit: item }" />
      </ng-container>

      <ng-template #defaultWidgetRender>
        <!-- 1. KPI Cards Widget -->
        <ng-container *ngIf="item.id === 'kpis'">
          <ng-container *ngIf="contentKpis(); else defaultKpis">
            <ng-container *ngTemplateOutlet="contentKpis()!" />
          </ng-container>
          <ng-template #defaultKpis>
            <div class="ecom-kpi-row" *ngIf="kpis() && kpis().length > 0">
              <div
                class="ecom-card"
                *ngFor="let k of kpis()"
                (click)="kpiClick.emit(k)"
                style="cursor: pointer;"
              >
                <span class="card-label">{{ k.label }}</span>
                <div class="val-line">
                  <span class="val-num">{{ k.value }}</span>
                  <span
                    class="trend-tag"
                    [class.pos]="k.trend === 'pos' || (!k.trend && k.meta.startsWith('+'))"
                    [class.neg]="k.trend === 'neg' || (!k.trend && k.meta.startsWith('-'))"
                  >
                    {{ k.meta }}
                  </span>
                </div>
              </div>
            </div>
          </ng-template>
        </ng-container>

        <!-- 2. Top Products Widget -->
        <ng-container *ngIf="item.id === 'top-products'">
          <ng-container *ngIf="contentProducts(); else defaultProducts">
            <ng-container *ngTemplateOutlet="contentProducts()!" />
          </ng-container>
          <ng-template #defaultProducts>
            <div class="ecom-panel" *ngIf="topProducts() && topProducts().length > 0" style="height: 100%;">
              <div class="panel-header">
                <h3 class="panel-title">{{ productsTitle() }}</h3>
                <gp-button variant="text" severity="primary" (onClickEvent)="viewAllProductsClick.emit()">View Catalog</gp-button>
              </div>
              <div class="product-list">
                <div
                  class="prod-row"
                  *ngFor="let prod of topProducts()"
                  (click)="productClick.emit(prod)"
                  style="cursor: pointer;"
                >
                  <div class="prod-info">
                    <div class="prod-name">{{ prod.name }}</div>
                    <div class="prod-cat">{{ prod.category }}</div>
                  </div>
                  <div class="prod-stats">
                    <span class="prod-rev">{{ prod.revenue }}</span>
                    <span class="prod-sales">{{ prod.sales }} sold</span>
                  </div>
                </div>
              </div>
            </div>
          </ng-template>
        </ng-container>

        <!-- 3. Recent Orders Widget -->
        <ng-container *ngIf="item.id === 'recent-orders'">
          <ng-container *ngIf="contentOrders(); else defaultOrders">
            <ng-container *ngTemplateOutlet="contentOrders()!" />
          </ng-container>
          <ng-template #defaultOrders>
            <div class="ecom-panel" *ngIf="recentOrders() && recentOrders().length > 0" style="height: 100%;">
              <div class="panel-header">
                <h3 class="panel-title">{{ ordersTitle() }}</h3>
                <gp-badge *ngIf="ordersBadge()" [value]="ordersBadge()" severity="primary" />
              </div>
              <table class="orders-table">
                <thead>
                  <tr>
                    <th>Order #</th>
                    <th>Customer</th>
                    <th>Total</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  <tr
                    *ngFor="let order of recentOrders()"
                    (click)="orderClick.emit(order)"
                    style="cursor: pointer;"
                  >
                    <td>
                      <span class="order-id">{{ order.id }}</span>
                    </td>
                    <td>{{ order.customer }}</td>
                    <td>
                      <strong>{{ order.amount }}</strong>
                    </td>
                    <td>
                      <gp-badge
                        [value]="order.status"
                        [severity]="order.status === 'Completed' ? 'success' : (order.status === 'Processing' ? 'primary' : 'warning')"
                      />
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </ng-template>
        </ng-container>
      </ng-template>
    </ng-template>
  </gp-grid>
</div>
