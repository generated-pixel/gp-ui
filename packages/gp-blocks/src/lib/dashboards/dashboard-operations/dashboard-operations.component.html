<div class="gp-dashboard-ops-root">
  <!-- Optional Top Action Bar / Slot -->
  <div class="dashboard-top-slot" *ngIf="contentHeaderActions()">
    <ng-container *ngTemplateOutlet="contentHeaderActions()!" />
  </div>
  <ng-content select="[actions], [slot=actions]" />

  <!-- Drag-and-Drop Grid Canvas -->
  <gp-grid
    [(items)]="widgets"
    [columns]="gridColumns()"
    [rowHeight]="gridRowHeight()"
    [gap]="gridGap()"
    [compactType]="gridCompactType()"
    [readonly]="gridReadonly()"
    (layoutChanged)="onLayoutChanged($event)"
  >
    <ng-template #widgetTemplate let-item>
      <!-- Custom User-Defined Template per Item or Widget Slot -->
      <ng-container *ngIf="effectiveWidgetTemplate(); else defaultWidgetRender">
        <ng-container *ngTemplateOutlet="effectiveWidgetTemplate()!; context: { $implicit: item }" />
      </ng-container>

      <ng-template #defaultWidgetRender>
        <!-- 1. Fleet Status Banner Widget -->
        <ng-container *ngIf="item.id === 'fleet-status'">
          <ng-container *ngIf="contentStatus(); else defaultStatus">
            <ng-container *ngTemplateOutlet="contentStatus()!" />
          </ng-container>
          <ng-template #defaultStatus>
            <div class="ops-status-banner">
              <div class="banner-left">
                <span class="live-dot"></span>
                <span class="banner-text">{{ bannerText() }}</span>
              </div>
              <gp-badge [value]="uptimeBadge()" severity="success" />
            </div>
          </ng-template>
        </ng-container>

        <!-- 2. Nodes List Widget -->
        <ng-container *ngIf="item.id === 'nodes-list'">
          <ng-container *ngIf="contentNodes(); else defaultNodes">
            <ng-container *ngTemplateOutlet="contentNodes()!" />
          </ng-container>
          <ng-template #defaultNodes>
            <div class="ops-node-grid" *ngIf="nodes() && nodes().length > 0" style="height: 100%;">
              <div
                class="node-card"
                *ngFor="let node of nodes()"
                (click)="nodeClick.emit(node)"
                style="cursor: pointer;"
              >
                <div class="node-head">
                  <span class="node-name">{{ node.name }}</span>
                  <gp-badge
                    [value]="node.status"
                    [severity]="node.status === 'Healthy' ? 'success' : (node.status === 'Degraded' ? 'warning' : 'danger')"
                  />
                </div>

                <div class="node-metrics-list">
                  <div class="metric-meter">
                    <div class="meter-info">
                      <span>CPU Utilization</span>
                      <span>{{ node.cpu }}%</span>
                    </div>
                    <gp-progress-bar [value]="node.cpu" [showValue]="false" />
                  </div>

                  <div class="metric-meter">
                    <div class="meter-info">
                      <span>Memory Load</span>
                      <span>{{ node.ram }}%</span>
                    </div>
                    <gp-progress-bar [value]="node.ram" [showValue]="false" />
                  </div>
                </div>

                <div class="node-footer-meta">
                  <span>{{ node.latency }}ms latency</span>
                  <span>{{ node.rps }}</span>
                </div>
              </div>
            </div>
          </ng-template>
        </ng-container>
      </ng-template>
    </ng-template>
  </gp-grid>
</div>
