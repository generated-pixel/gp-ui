<div class="gp-settings-card">
  <!-- Header -->
  <ng-container *ngIf="effectiveHeader; else defaultHeader">
    <ng-container *ngTemplateOutlet="effectiveHeader" />
  </ng-container>
  <ng-template #defaultHeader>
    <ng-content select="[header], [slot=header]">
      <div class="settings-head-action-row">
        <div>
          <h3 class="settings-title">{{ title() }}</h3>
          <p class="settings-subtitle">{{ subtitle() }}</p>
        </div>
        <gp-button severity="primary" size="sm" (onClick)="generateKey.emit()">
          <gp-icon name="plus" size="0.85em" style="margin-right: 0.35rem;" />
          {{ generateBtnLabel() }}
        </gp-button>
      </div>
    </ng-content>
  </ng-template>

  <!-- Content Override or Keys List -->
  <ng-container *ngIf="effectiveContent; else defaultContent">
    <ng-container *ngTemplateOutlet="effectiveContent" />
  </ng-container>
  <ng-template #defaultContent>
    <ng-content select="[content], [slot=content]">
      <ng-container *ngIf="effectiveKeys; else defaultKeys">
        <ng-container *ngTemplateOutlet="effectiveKeys" />
      </ng-container>
      <ng-template #defaultKeys>
        <ng-content select="[keys], [slot=keys]">
          <div class="keys-list" *ngIf="apiKeys() && apiKeys().length > 0">
            <div class="api-key-item" *ngFor="let k of apiKeys()">
              <div class="key-top-info">
                <div class="key-name-group">
                  <span class="key-name">{{ k.name }}</span>
                  <gp-badge [value]="k.scope" severity="primary" />
                </div>
                <div class="key-token-display">
                  <code>{{ k.token }}</code>
                  <button type="button" class="copy-btn" (click)="copyKey.emit(k)" title="Copy Key">
                    <gp-icon name="copy" size="0.9em" />
                  </button>
                </div>
              </div>
              <div class="key-bottom-meta">
                <span>Created: {{ k.created }}</span>
                <span>Last used: {{ k.lastUsed }}</span>
                <gp-button variant="text" severity="danger" size="sm" (onClick)="revokeKey.emit(k)">Revoke</gp-button>
              </div>
            </div>
          </div>
        </ng-content>
      </ng-template>
      <ng-content />
    </ng-content>
  </ng-template>
</div>
