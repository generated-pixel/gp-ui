<div class="gp-settings-card">
      <div class="settings-head">
        <h3 class="settings-title">{{ title }}</h3>
        <p class="settings-subtitle">{{ subtitle }}</p>
      </div>

      <!-- Password Change Section -->
      <div class="security-section">
        <h4 class="sec-subtitle">Change Password</h4>
        <div class="pass-fields-grid">
          <div class="field-col">
            <label class="f-label">Current Password</label>
            <gp-password placeholder="Enter current password" class="full-width-control" />
          </div>
          <div class="field-col">
            <label class="f-label">New Password</label>
            <gp-password placeholder="Enter new password" class="full-width-control" />
          </div>
          <div class="field-col">
            <label class="f-label">Confirm New Password</label>
            <gp-password placeholder="Confirm new password" class="full-width-control" />
          </div>
        </div>
        <div class="sec-action-row">
          <gp-button severity="primary" size="sm">Update Password</gp-button>
        </div>
      </div>

      <!-- 2FA Section -->
      <div class="security-section">
        <div class="two-fa-row">
          <div class="two-fa-info">
            <div class="two-fa-title-row">
              <h4 class="sec-subtitle" style="margin: 0;">Two-Factor Authentication (2FA)</h4>
              <gp-badge value="Enabled" severity="success" />
            </div>
            <p class="two-fa-desc">Require an authentication code from Google Authenticator or SMS on login.</p>
          </div>
          <gp-switch [value]="true" />
        </div>
      </div>

      <!-- Active Sessions -->
      <div class="security-section">
        <h4 class="sec-subtitle">Active Browser Sessions</h4>
        <div class="sessions-list">
          <div class="session-item">
            <div class="sess-ico">
              <gp-icon name="window" size="1.1em" />
            </div>
            <div class="sess-info">
              <span class="sess-title">Chrome on macOS (San Francisco, CA)</span>
              <span class="sess-meta">Current Active Session &bull; IP 192.168.1.1</span>
            </div>
            <gp-badge value="Current" severity="primary" />
          </div>
        </div>
      </div>
    </div>
