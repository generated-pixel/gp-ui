<div class="gp-settings-card">
  <!-- Header -->
  <ng-container *ngIf="effectiveHeader; else defaultHeader">
    <ng-container *ngTemplateOutlet="effectiveHeader" />
  </ng-container>
  <ng-template #defaultHeader>
    <ng-content select="[header], [slot=header]">
      <div class="settings-head">
        <h3 class="settings-title">{{ title() }}</h3>
        <p class="settings-subtitle">{{ subtitle() }}</p>
      </div>
    </ng-content>
  </ng-template>

  <!-- Full Content Override or Sections -->
  <ng-container *ngIf="effectiveContent; else defaultContent">
    <ng-container *ngTemplateOutlet="effectiveContent" />
  </ng-container>
  <ng-template #defaultContent>
    <ng-content select="[content], [slot=content]">
      <!-- Current Subscription Box -->
      <ng-container *ngIf="effectivePlan; else defaultPlan">
        <ng-container *ngTemplateOutlet="effectivePlan" />
      </ng-container>
      <ng-template #defaultPlan>
        <ng-content select="[plan], [slot=plan]">
          <div class="current-plan-box">
            <div class="plan-info">
              <div class="plan-name-row">
                <span class="plan-name">{{ planName() }}</span>
                <gp-badge [value]="planStatus()" severity="success" />
              </div>
              <p class="plan-price">{{ planPrice() }}</p>
            </div>
            <div class="plan-actions">
              <gp-button variant="outlined" severity="secondary" (onClickEvent)="changePlan.emit()">Change Plan</gp-button>
              <gp-button variant="outlined" severity="danger" (onClickEvent)="cancelPlan.emit()">Cancel</gp-button>
            </div>
          </div>
        </ng-content>
      </ng-template>

      <!-- Invoices History -->
      <ng-container *ngIf="effectiveInvoices; else defaultInvoices">
        <ng-container *ngTemplateOutlet="effectiveInvoices" />
      </ng-container>
      <ng-template #defaultInvoices>
        <ng-content select="[invoices], [slot=invoices]">
          <div class="invoices-section" *ngIf="invoices() && invoices().length > 0">
            <h4 class="sec-subtitle">Billing History & Invoices</h4>
            <table class="billing-table">
              <thead>
                <tr>
                  <th>Invoice Date</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let inv of invoices()">
                  <td>{{ inv.date }}</td>
                  <td><strong>{{ inv.amount }}</strong></td>
                  <td>
                    <gp-badge
                      [value]="inv.status"
                      [severity]="inv.status === 'Paid' ? 'success' : (inv.status === 'Pending' ? 'warning' : 'danger')"
                    />
                  </td>
                  <td>
                    <gp-button variant="link" severity="primary" size="sm" styleClass="download-link" (onClickEvent)="downloadInvoice.emit(inv)">
                      <gp-icon name="download" size="0.85em" />
                      PDF
                    </gp-button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </ng-content>
      </ng-template>
      <ng-content />
    </ng-content>
  </ng-template>
</div>
