<div class="gp-settings-card">
      <div class="settings-head">
        <h3 class="settings-title">{{ title }}</h3>
        <p class="settings-subtitle">{{ subtitle }}</p>
      </div>

      <!-- Current Subscription Box -->
      <div class="current-plan-box">
        <div class="plan-info">
          <div class="plan-name-row">
            <span class="plan-name">Enterprise Growth</span>
            <gp-badge value="Active" severity="success" />
          </div>
          <p class="plan-price">$499 / month &bull; Billed annually (Renews Nov 15, 2026)</p>
        </div>
        <div class="plan-actions">
          <gp-button variant="outlined" severity="secondary">Change Plan</gp-button>
          <gp-button variant="outlined" severity="danger">Cancel</gp-button>
        </div>
      </div>

      <!-- Invoices History -->
      <div class="invoices-section">
        <h4 class="sec-subtitle">Billing History & Invoices</h4>
        <table class="billing-table">
          <thead>
            <tr>
              <th>Invoice Date</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let inv of invoices">
              <td>{{ inv.date }}</td>
              <td><strong>{{ inv.amount }}</strong></td>
              <td><gp-badge value="Paid" severity="success" /></td>
              <td>
                <button type="button" class="download-link">
                  <gp-icon name="download" size="0.85em" />
                  PDF
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
