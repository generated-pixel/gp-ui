<div class="gp-settings-card">
  <div class="settings-head">
    <h3 class="settings-title">{{ title() }}</h3>
    <p class="settings-subtitle">{{ subtitle() }}</p>
  </div>

  <div class="notifications-list" *ngIf="preferences() && preferences().length > 0">
    <div class="notif-row" *ngFor="let item of preferences()">
      <div class="notif-info">
        <span class="notif-label">{{ item.title }}</span>
        <span class="notif-desc">{{ item.desc }}</span>
      </div>
      <gp-switch [value]="item.enabled" (valueChange)="onToggle(item, $event)" />
    </div>
  </div>

  <div class="settings-footer">
    <gp-button severity="primary" (onClick)="save.emit(preferences())">{{ saveBtnLabel() }}</gp-button>
  </div>
</div>
