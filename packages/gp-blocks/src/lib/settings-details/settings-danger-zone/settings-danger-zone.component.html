<div class="gp-danger-zone-card">
  <div class="danger-head">
    <h3 class="danger-title">{{ title() }}</h3>
    <p class="danger-subtitle">{{ subtitle() }}</p>
  </div>

  <div class="danger-actions-list" *ngIf="actions() && actions().length > 0">
    <div class="danger-row" *ngFor="let a of actions()">
      <div class="danger-info">
        <span class="d-action-title">{{ a.title }}</span>
        <span class="d-action-desc">{{ a.desc }}</span>
      </div>
      <gp-button
        [variant]="a.buttonVariant || 'outlined'"
        severity="danger"
        (onClick)="actionClick.emit(a)"
      >
        {{ a.buttonLabel }}
      </gp-button>
    </div>
  </div>
</div>
