<div class="gp-transactions-card">
  <!-- Header -->
  <ng-container *ngIf="effectiveHeader; else defaultHeader">
    <ng-container *ngTemplateOutlet="effectiveHeader" />
  </ng-container>
  <ng-template #defaultHeader>
    <ng-content select="[header], [slot=header]">
      <div class="card-head" *ngIf="title()">
        <h3 class="head-title">{{ title() }}</h3>
        <gp-badge *ngIf="badgeText()" [value]="badgeText()" [severity]="badgeSeverity()" />
      </div>
    </ng-content>
  </ng-template>

  <!-- Transactions List Body -->
  <ng-container *ngIf="effectiveContent; else defaultContent">
    <ng-container *ngTemplateOutlet="effectiveContent" />
  </ng-container>
  <ng-template #defaultContent>
    <ng-content select="[transactions], [slot=transactions], [items], [slot=items]">
      <div class="trans-list" *ngIf="transactions() && transactions().length > 0">
        <ng-container *ngFor="let t of transactions()">
          <ng-container *ngIf="effectiveTransactionTemplate; else defaultTrans">
            <ng-container *ngTemplateOutlet="effectiveTransactionTemplate; context: { $implicit: t }" />
          </ng-container>
          <ng-template #defaultTrans>
            <div
              class="trans-row"
              (click)="transactionClick.emit(t)"
              style="cursor: pointer;"
            >
              <div class="trans-left">
                <div class="trans-icon" [class.in]="t.type === 'in'" [class.out]="t.type === 'out'">
                  <gp-icon [name]="t.type === 'in' ? 'arrow-down-left' : 'arrow-up-right'" size="1em" />
                </div>
                <div class="trans-meta">
                  <span class="trans-title">{{ t.title }}</span>
                  <span class="trans-sub">{{ t.category }} &bull; {{ t.date }}</span>
                </div>
              </div>

              <div class="trans-right">
                <span class="trans-amt" [class.in]="t.type === 'in'" [class.out]="t.type === 'out'">
                  {{ t.type === 'in' ? '+' : '-' }}{{ t.amount }}
                </span>
                <gp-badge
                  [value]="t.status"
                  [severity]="t.status === 'Completed' ? 'success' : (t.status === 'Pending' ? 'warning' : 'danger')"
                />
              </div>
            </div>
          </ng-template>
        </ng-container>
      </div>
    </ng-content>
  </ng-template>
  <ng-content />
</div>
