<div class="gp-data-grid-block">
  <!-- Toolbar Header -->
  <ng-container *ngIf="effectiveToolbar; else defaultToolbar">
    <ng-container *ngTemplateOutlet="effectiveToolbar" />
  </ng-container>
  <ng-template #defaultToolbar>
    <ng-content select="[toolbar], [slot=toolbar]">
      <div class="grid-toolbar">
        <div class="search-box">
          <gp-icon name="search" size="0.9em" class="search-ico" />
          <input
            type="text"
            [value]="searchQuery()"
            [placeholder]="searchPlaceholder()"
            (input)="onSearchInput($event)"
            class="search-input"
          />
        </div>
        <div class="toolbar-actions">
          <gp-button variant="outlined" severity="secondary" size="sm" (onClick)="filterClick.emit()">
            <gp-icon name="sliders" size="0.85em" style="margin-right: 0.35rem;" />
            {{ filterBtnLabel() }}
          </gp-button>
          <gp-button severity="primary" size="sm" (onClick)="newOrderClick.emit()">
            <gp-icon name="plus" size="0.85em" style="margin-right: 0.35rem;" />
            {{ newOrderBtnLabel() }}
          </gp-button>
        </div>
      </div>
    </ng-content>
  </ng-template>

  <!-- Table Body -->
  <ng-container *ngIf="effectiveContent; else defaultContent">
    <ng-container *ngTemplateOutlet="effectiveContent" />
  </ng-container>
  <ng-template #defaultContent>
    <ng-content select="[content], [slot=content]">
      <div class="table-scroll-wrap" *ngIf="rows() && rows().length > 0">
        <table class="gp-block-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Payment</th>
              <th>Fulfillment</th>
              <th style="text-align: right;">Action</th>
            </tr>
          </thead>
          <tbody>
            <ng-container *ngFor="let r of rows()">
              <ng-container *ngIf="effectiveRowTemplate; else defaultRow">
                <ng-container *ngTemplateOutlet="effectiveRowTemplate; context: { $implicit: r }" />
              </ng-container>
              <ng-template #defaultRow>
                <tr (click)="rowClick.emit(r)" style="cursor: pointer;">
                  <td><span class="id-tag">#{{ r.id }}</span></td>
                  <td><strong>{{ r.customer }}</strong></td>
                  <td>{{ r.date }}</td>
                  <td><strong>{{ r.amount }}</strong></td>
                  <td>
                    <gp-badge
                      [value]="r.payment"
                      [severity]="r.payment === 'Paid' ? 'success' : (r.payment === 'Pending' ? 'warning' : 'danger')"
                    />
                  </td>
                  <td>
                    <gp-badge
                      [value]="r.fulfillment"
                      [severity]="r.fulfillment === 'Delivered' ? 'success' : (r.fulfillment === 'Processing' ? 'primary' : 'secondary')"
                    />
                  </td>
                  <td style="text-align: right;">
                    <button
                      type="button"
                      class="row-action-btn"
                      (click)="$event.stopPropagation(); rowActionClick.emit(r)"
                      title="Row Options"
                    >
                      <gp-icon name="more-horizontal" size="1em" />
                    </button>
                  </td>
                </tr>
              </ng-template>
            </ng-container>
          </tbody>
        </table>
      </div>
    </ng-content>
  </ng-template>

  <!-- Footer Pagination / Status -->
  <ng-container *ngIf="effectiveFooter; else defaultFooter">
    <ng-container *ngTemplateOutlet="effectiveFooter" />
  </ng-container>
  <ng-template #defaultFooter>
    <ng-content select="[footer], [slot=footer]">
      <div class="grid-footer" *ngIf="footerCountText()">
        <span class="count-text">{{ footerCountText() }}</span>
        <div class="pager-btns">
          <gp-button variant="outlined" severity="secondary" size="sm">Previous</gp-button>
          <gp-button variant="outlined" severity="secondary" size="sm">Next</gp-button>
        </div>
      </div>
    </ng-content>
  </ng-template>
  <ng-content />
</div>
