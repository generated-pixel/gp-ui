<div class="gp-card-grid-block">
  <!-- Header -->
  <ng-container *ngIf="effectiveHeader; else defaultHeader">
    <ng-container *ngTemplateOutlet="effectiveHeader" />
  </ng-container>
  <ng-template #defaultHeader>
    <ng-content select="[header], [slot=header]">
      <div class="block-top" *ngIf="title()">
        <div>
          <h3 class="head-title">{{ title() }}</h3>
          <p class="head-subtitle" *ngIf="subtitle()">{{ subtitle() }}</p>
        </div>
        <gp-button severity="primary" size="sm" (onClickEvent)="createClick.emit()">
          <gp-icon name="plus" size="0.85em" style="margin-right: 0.35rem;" />
          {{ createBtnLabel() }}
        </gp-button>
      </div>
    </ng-content>
  </ng-template>

  <!-- Cards Grid -->
  <ng-container *ngIf="effectiveContent; else defaultContent">
    <ng-container *ngTemplateOutlet="effectiveContent" />
  </ng-container>
  <ng-template #defaultContent>
    <ng-content select="[cards], [slot=cards]">
      <div class="grid-wrap" *ngIf="cards() && cards().length > 0">
        <ng-container *ngFor="let c of cards()">
          <ng-container *ngIf="effectiveCardTemplate; else defaultCard">
            <ng-container *ngTemplateOutlet="effectiveCardTemplate; context: { $implicit: c }" />
          </ng-container>
          <ng-template #defaultCard>
            <div
              class="item-card"
              (click)="cardClick.emit(c)"
              style="cursor: pointer;"
            >
              <div class="card-head">
                <div class="card-ico">
                  <gp-icon [name]="c.icon" size="1.2em" />
                </div>
                <gp-badge [value]="c.status" [severity]="c.status === 'Active' ? 'success' : 'secondary'" />
              </div>
              <h4 class="card-title">{{ c.title }}</h4>
              <p class="card-desc">{{ c.desc }}</p>
              <div class="card-foot">
                <span class="card-meta">{{ c.meta }}</span>
                <gp-icon name="arrow-right" size="0.85em" class="foot-arrow" />
              </div>
            </div>
          </ng-template>
        </ng-container>
      </div>
    </ng-content>
  </ng-template>
  <ng-content />
</div>
