<div class="gp-stacked-feed-card">
  <!-- Header -->
  <ng-container *ngIf="effectiveHeader; else defaultHeader">
    <ng-container *ngTemplateOutlet="effectiveHeader" />
  </ng-container>
  <ng-template #defaultHeader>
    <ng-content select="[header], [slot=header]" />

      <div class="card-head" *ngIf="title()">
        <h3 class="head-title">{{ title() }}</h3>
        <gp-badge *ngIf="badgeText()" [value]="badgeText()" [severity]="badgeSeverity()" />
      </div>
    
  </ng-template>

  <!-- Feed Items Body -->
  <ng-container *ngIf="effectiveContent; else defaultContent">
    <ng-container *ngTemplateOutlet="effectiveContent" />
  </ng-container>
  <ng-template #defaultContent>
    <ng-content select="[feed], [slot=feed], [items], [slot=items]" />

      <div class="feed-list" *ngIf="feedItems() && feedItems().length > 0">
        <ng-container *ngFor="let f of feedItems()">
          <ng-container *ngIf="effectiveFeedItemTemplate; else defaultFeedItem">
            <ng-container *ngTemplateOutlet="effectiveFeedItemTemplate; context: { $implicit: f }" />
          </ng-container>
          <ng-template #defaultFeedItem>
            <div
              class="feed-item-row"
              (click)="itemClick.emit(f)"
              style="cursor: pointer;"
            >
              <gp-avatar [label]="f.author.charAt(0)" size="normal" shape="circle" />
              <div class="feed-main-col">
                <div class="feed-action-line">
                  <strong class="author-name">{{ f.author }}</strong>
                  <span class="action-text">{{ f.action }}</span>
                  <span class="target-name">{{ f.target }}</span>
                </div>
                <div class="feed-message-box" *ngIf="f.message">
                  {{ f.message }}
                </div>
                <span class="feed-time">{{ f.time }}</span>
              </div>
              <gp-button
                type="button"
                variant="text"
                severity="secondary"
                [iconOnly]="true"
                styleClass="more-btn"
                ariaLabel="Options"
                (onClickEvent)="$event.stopPropagation(); itemOptionsClick.emit(f)"
              >
                <gp-icon name="more-horizontal" size="1em" />
              </gp-button>
            </div>
          </ng-template>
        </ng-container>
      </div>
    
  </ng-template>
  <ng-content />
</div>
