<div class="gp-page-error-root">
      <div class="error-visual-badge error-red">500</div>
      <h1 class="error-title">{{ title }}</h1>
      <p class="error-desc">{{ description }}</p>
      <div class="error-actions">
        <gp-button variant="outlined" severity="secondary">Contact Support</gp-button>
        <gp-button severity="danger">
          <gp-icon name="refresh" size="0.85em" style="margin-right: 0.35rem;" />
          Retry Request
        </gp-button>
      </div>
    </div>
