<div class="gp-page-error-root">
      <div class="error-visual-badge">404</div>
      <h1 class="error-title">{{ title }}</h1>
      <p class="error-desc">{{ description }}</p>
      <div class="error-actions">
        <gp-button variant="outlined" severity="secondary">
          <gp-icon name="chevron-left" size="0.85em" style="margin-right: 0.35rem;" />
          Go Back
        </gp-button>
        <gp-button severity="primary">
          <gp-icon name="home" size="0.85em" style="margin-right: 0.35rem;" />
          Return Home
        </gp-button>
      </div>
    </div>
