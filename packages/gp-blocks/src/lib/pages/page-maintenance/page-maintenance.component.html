<div class="gp-maintenance-root">
      <div class="maint-icon-wrap">
        <gp-icon name="sliders" size="2.5em" />
      </div>
      <gp-badge value="Scheduled Upgrade in Progress" severity="warning" />
      <h1 class="maint-title">{{ title }}</h1>
      <p class="maint-desc">{{ description }}</p>

      <div class="uptime-box">
        <span class="est-label">Estimated Completion</span>
        <span class="est-val">{{ estimatedUptime }}</span>
      </div>
    </div>
