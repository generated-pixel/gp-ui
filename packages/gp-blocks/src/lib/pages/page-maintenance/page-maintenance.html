<div class="gp-page-state-shell">
  <div class="state-card">
    @if (effectiveContent()) {
    <ng-container *ngTemplateOutlet="effectiveContent()!" />
    } @else {
    <!-- Icon -->
    @if (effectiveIcon()) {
    <ng-container *ngTemplateOutlet="effectiveIcon()!" />
    } @else {
    <ng-content select="[icon], [slot=icon]" />
    <div class="maintenance-icon-box">
      <gp-icon [name]="icon()" size="1.75em" />
    </div>
    } @if (badgeText()) {
    <gp-badge [value]="badgeText()" [severity]="badgeSeverity()" [style]="{ marginBottom: '1rem' }" />
    } @if (title()) {
    <h2 class="state-title">{{ title() }}</h2>
    } @if (description()) {
    <p class="state-desc">{{ description() }}</p>
    } @if (estimatedUptime()) {
    <div class="uptime-box">
      <span class="u-label">{{ estimatedUptimeLabel() }}</span>
      <strong class="u-val">{{ estimatedUptime() }}</strong>
    </div>
    }
    <ng-content />
    }
  </div>
</div>
