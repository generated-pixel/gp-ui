<div class="gp-coming-soon-card">
  <div class="cs-badge" *ngIf="badgeText()">{{ badgeText() }}</div>
  <h1 class="cs-title">{{ title() }}</h1>
  <p class="cs-desc" *ngIf="description()">{{ description() }}</p>

  <!-- Countdown Timer -->
  <div class="countdown-row" *ngIf="countdown() && countdown().length > 0">
    <div class="count-box" *ngFor="let u of countdown()">
      <span class="count-num">{{ u.value }}</span>
      <span class="count-lbl">{{ u.label }}</span>
    </div>
  </div>

  <!-- Email Capture Form -->
  <div class="email-capture-form">
    <input
      type="email"
      [value]="email()"
      (input)="email.set($any($event.target).value)"
      (keydown.enter)="onSubscribe()"
      [placeholder]="emailPlaceholder()"
      class="cs-inp"
    />
    <gp-button severity="primary" (onClick)="onSubscribe()">{{ notifyBtnLabel() }}</gp-button>
  </div>
</div>
