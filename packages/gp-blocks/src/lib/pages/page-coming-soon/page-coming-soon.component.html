<div class="gp-coming-soon-card">
      <div class="cs-badge">SOMETHING BIG IS COMING</div>
      <h1 class="cs-title">{{ title }}</h1>
      <p class="cs-desc">{{ description }}</p>

      <!-- Countdown Timer Mock -->
      <div class="countdown-row">
        <div class="count-box">
          <span class="count-num">14</span>
          <span class="count-lbl">Days</span>
        </div>
        <div class="count-box">
          <span class="count-num">08</span>
          <span class="count-lbl">Hours</span>
        </div>
        <div class="count-box">
          <span class="count-num">42</span>
          <span class="count-lbl">Minutes</span>
        </div>
        <div class="count-box">
          <span class="count-num">19</span>
          <span class="count-lbl">Seconds</span>
        </div>
      </div>

      <!-- Email Capture Form -->
      <div class="email-capture-form">
        <input type="email" placeholder="Enter your work email address..." class="cs-inp" />
        <gp-button severity="primary">Notify Me</gp-button>
      </div>
    </div>
