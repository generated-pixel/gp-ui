<div class="gp-success-confirm-card">
  <div class="success-icon-wrap">
    <gp-icon [name]="icon()" size="2.5em" />
  </div>
  <h1 class="success-title">{{ title() }}</h1>
  <p class="success-desc" *ngIf="description()">{{ description() }}</p>

  <div class="receipt-box">
    <div class="receipt-row" *ngIf="orderNumber()">
      <span>{{ orderNumberLabel() }}</span>
      <strong>{{ orderNumber() }}</strong>
    </div>
    <div class="receipt-row" *ngIf="email()">
      <span>{{ emailLabel() }}</span>
      <strong>{{ email() }}</strong>
    </div>
  </div>

  <div class="success-actions">
    <gp-button *ngIf="secondaryBtnLabel()" variant="outlined" severity="secondary" (onClick)="secondaryAction.emit()">
      {{ secondaryBtnLabel() }}
    </gp-button>
    <gp-button *ngIf="primaryBtnLabel()" severity="primary" (onClick)="primaryAction.emit()">
      {{ primaryBtnLabel() }}
    </gp-button>
  </div>
</div>
