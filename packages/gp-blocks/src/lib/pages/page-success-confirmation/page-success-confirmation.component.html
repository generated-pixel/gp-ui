<div class="gp-page-state-shell">
  <div class="state-card">
    <ng-container *ngIf="effectiveContent(); else defaultContent">
      <ng-container *ngTemplateOutlet="effectiveContent()!" />
    </ng-container>
    <ng-template #defaultContent>
      <!-- Success Icon -->
      <ng-container *ngIf="effectiveIcon(); else defaultIcon">
        <ng-container *ngTemplateOutlet="effectiveIcon()!" />
      </ng-container>
      <ng-template #defaultIcon>
        <ng-content select="[icon], [slot=icon]" />

          <div class="success-icon-box">
            <gp-icon [name]="icon()" size="2em" />
          </div>
        
      </ng-template>

      <!-- Headings -->
      <h2 class="state-title" *ngIf="title()">{{ title() }}</h2>
      <p class="state-desc" *ngIf="description()">{{ description() }}</p>

      <!-- Details Box -->
      <ng-container *ngIf="effectiveDetails(); else defaultDetails">
        <ng-container *ngTemplateOutlet="effectiveDetails()!" />
      </ng-container>
      <ng-template #defaultDetails>
        <ng-content select="[details], [slot=details]" />

          <div class="receipt-box" *ngIf="orderNumber() || email()">
            <div class="receipt-row" *ngIf="orderNumber()">
              <span>{{ orderNumberLabel() }}</span>
              <strong>{{ orderNumber() }}</strong>
            </div>
            <div class="receipt-row" *ngIf="email()">
              <span>{{ emailLabel() }}</span>
              <strong>{{ email() }}</strong>
            </div>
          </div>
        
      </ng-template>

      <!-- Actions -->
      <ng-container *ngIf="effectiveActions(); else defaultActions">
        <ng-container *ngTemplateOutlet="effectiveActions()!" />
      </ng-container>
      <ng-template #defaultActions>
        <ng-content select="[actions], [slot=actions]" />

          <div class="state-actions-row">
            <gp-button variant="outlined" severity="secondary" (onClickEvent)="secondaryAction.emit()">{{ secondaryBtnLabel() }}</gp-button>
            <gp-button severity="primary" (onClickEvent)="primaryAction.emit()">
              <gp-icon name="download" size="0.85em" style="margin-right: 0.35rem;" />
              {{ primaryBtnLabel() }}
            </gp-button>
          </div>
        
      </ng-template>
      <ng-content />
    </ng-template>
  </div>
</div>
