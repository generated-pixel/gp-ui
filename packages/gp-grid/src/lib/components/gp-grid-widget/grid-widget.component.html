<div
  class="gp-grid-widget"
  [class.gp-grid-widget--locked]="isLocked()"
  [class.gp-grid-widget--fixed]="isFixed()"
  [class.gp-grid-widget--dragging]="isDragging()"
  [class.gp-grid-widget--resizing]="isResizing()"
  [ngClass]="customClass()"
>
  @if (showHeader()) {
    <header class="gp-grid-widget-header">
      <div class="gp-grid-widget-header-start">
        @if (isDraggable()) {
          <div
            class="gp-grid-widget-drag-handle"
            title="Drag to reposition widget"
            aria-label="Drag handle"
          >
            <svg
              class="gp-grid-handle-icon"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="currentColor"
            >
              <circle cx="9" cy="5" r="1.5"></circle>
              <circle cx="9" cy="12" r="1.5"></circle>
              <circle cx="9" cy="19" r="1.5"></circle>
              <circle cx="15" cy="5" r="1.5"></circle>
              <circle cx="15" cy="12" r="1.5"></circle>
              <circle cx="15" cy="19" r="1.5"></circle>
            </svg>
          </div>
        } @else if (isLocked()) {
          <div
            class="gp-grid-widget-locked-badge"
            title="Widget is locked in place"
            aria-label="Locked in place"
          >
            <svg
              class="gp-grid-lock-icon"
              viewBox="0 0 24 24"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
        }

        <div class="gp-grid-widget-title-group">
          @if (effectiveTitle()) {
            <h3 class="gp-grid-widget-title" [title]="effectiveTitle()">
              {{ effectiveTitle() }}
            </h3>
          }
          @if (badge()) {
            <span
              class="gp-grid-widget-badge"
              [class]="'gp-grid-widget-badge--' + badgeSeverity()"
            >
              {{ badge() }}
            </span>
          }
          <ng-content select="[gpWidgetHeader]" />
        </div>
      </div>

      <div class="gp-grid-widget-header-actions">
        <ng-content select="[gpWidgetActions]" />

        <!-- Options Button -->
        <button
          type="button"
          class="gp-grid-widget-action-btn gp-grid-widget-options-btn"
          (click)="onOptions($event)"
          title="Widget options"
          aria-label="Widget options"
        >
          <svg
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="currentColor"
          >
            <circle cx="12" cy="12" r="1.5"></circle>
            <circle cx="12" cy="5" r="1.5"></circle>
            <circle cx="12" cy="19" r="1.5"></circle>
          </svg>
        </button>

        <!-- Close Button -->
        @if (isCloseable()) {
          <button
            type="button"
            class="gp-grid-widget-action-btn gp-grid-widget-close-btn"
            (click)="onClose($event)"
            title="Remove widget"
            aria-label="Remove widget"
          >
            <svg
              viewBox="0 0 24 24"
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        }
      </div>
    </header>
  }

  <div class="gp-grid-widget-body">
    <ng-content />
  </div>

  @if (isResizable()) {
    <div
      class="gp-grid-widget-resize-handle"
      title="Drag to resize"
      aria-label="Resize widget handle"
    >
      <svg
        viewBox="0 0 16 16"
        width="10"
        height="10"
        fill="currentColor"
        class="gp-grid-resize-icon"
      >
        <path d="M14 14H12V12H14V14ZM14 9H12V11H14V9ZM9 14H11V12H9V14ZM14 6H12V8H14V6ZM6 14H8V12H6V14ZM9 11H11V9H9V11Z" opacity="0.75"/>
      </svg>
    </div>
  }
</div>
