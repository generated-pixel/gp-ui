<div class="gp-rule-builder-card">
  <div class="builder-header">
    <div class="builder-title-wrap">
      <gp-icon name="sliders" size="1.1em" class="builder-icon" />
      <h4 class="builder-title">Interactive Rule Designer</h4>
    </div>
    <span class="builder-desc">Configure dynamic event triggers, predicates, and actions</span>
  </div>

  <div class="builder-body">
    <!-- Trigger Section -->
    <div class="builder-section">
      <span class="section-badge">1. When Event Fires</span>
      <div class="field-row">
        <div class="form-group flex-2">
          <label>Trigger Event</label>
          <gp-select
            [options]="triggerOptions"
            [ngModel]="triggerEvent()"
            (ngModelChange)="triggerEvent.set($event)"
          />
        </div>

        @if (triggerEvent() === 'keypress' || triggerEvent() === 'input') {
          <div class="form-group flex-1">
            <label>Debounce (ms)</label>
            <gp-input-number
              [ngModel]="debounceMs()"
              (ngModelChange)="debounceMs.set($event)"
              [min]="50"
              [max]="2000"
              [step]="50"
            />
          </div>
        }
      </div>
    </div>

    <!-- Condition Section -->
    <div class="builder-section">
      <span class="section-badge">2. If Condition Passes</span>
      <div class="field-row">
        <div class="form-group flex-1">
          <label>Target Field</label>
          <gp-input-text
            [ngModel]="conditionField()"
            (ngModelChange)="conditionField.set($event)"
            placeholder="e.g. promoCode"
          />
        </div>

        <div class="form-group flex-1">
          <label>Operator</label>
          <gp-select
            [options]="operatorOptions"
            [ngModel]="conditionOperator()"
            (ngModelChange)="conditionOperator.set($event)"
          />
        </div>

        <div class="form-group flex-1">
          <label>Expected Value</label>
          <gp-input-text
            [ngModel]="conditionValue()"
            (ngModelChange)="conditionValue.set($event)"
            placeholder="e.g. VIP100"
          />
        </div>
      </div>
    </div>

    <!-- Action Section -->
    <div class="builder-section">
      <span class="section-badge">3. Then Execute Action</span>
      <div class="field-row">
        <div class="form-group flex-1">
          <label>Action Type</label>
          <gp-select
            [options]="actionOptions"
            [ngModel]="actionType()"
            (ngModelChange)="actionType.set($event)"
          />
        </div>

        <div class="form-group flex-1">
          <label>Target Field / Element</label>
          <gp-input-text
            [ngModel]="actionTarget()"
            (ngModelChange)="actionTarget.set($event)"
            placeholder="e.g. discountAmount"
          />
        </div>

        <div class="form-group flex-1">
          <label>Value / Formula</label>
          <gp-input-text
            [ngModel]="actionValue()"
            (ngModelChange)="actionValue.set($event)"
            placeholder="e.g. 100 or quantity * 10"
          />
        </div>
      </div>
    </div>
  </div>

  <div class="builder-footer">
    <gp-button
      severity="primary"
      (onClickEvent)="onCreateRule()"
    >
      <gp-icon name="plus" size="0.9em" style="margin-right: 0.35rem;" />
      Register & Attach Rule
    </gp-button>
  </div>
</div>
