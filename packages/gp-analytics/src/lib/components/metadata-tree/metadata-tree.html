<div
  class="metadata-tree"
  role="tree"
  [attr.aria-label]="i18n.translate('metadataTree')">
  <gp-accordion [multiple]="true">
    @for (grouping of groupings(); track grouping.groupingId) {
    <gp-accordion-tab
      [header]="grouping.groupingName"
      [selected]="isGroupingExpanded(grouping.groupingId)"
      (selectedChange)="setGroupingExpanded(grouping.groupingId, $event)"
      role="treeitem"
      [attr.aria-expanded]="isGroupingExpanded(grouping.groupingId)">
      @if (showTableCounts()) {
      <div class="group-meta">{{ i18n.translate('tableCount', { count: grouping.tables.length }) }}</div>
      }
      <gp-tree
        [value]="treeNodes(grouping.groupingId)"
        [filter]="false"
        [emptyMessage]="i18n.translate('noVisibleFields')"
        (onNodeExpand)="onTreeNodeExpand($event)"
        (onNodeCollapse)="onTreeNodeCollapse($event)"
        [attr.aria-label]="i18n.translate('metadataTree')" />
    </gp-accordion-tab>
    } @empty {
    <p class="empty-state">{{ i18n.translate('noMetadataGroups') }}</p>
    }
  </gp-accordion>
</div>
