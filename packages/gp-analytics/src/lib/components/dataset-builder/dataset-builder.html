<div class="gp-dataset-builder" role="application">
  <!-- 3-Column Workbench: Available Fields (Left) | Dataset View (Middle) | Selected Fields (Right) -->
  <div class="builder-workbench-layout">
    <!-- Left Panel: Available fields (Schema Catalogue) -->
    <div class="workbench-panel panel-catalogue">
      <gp-schema-catalogue
        [groupings]="groupings()"
        [additionalRelationships]="additionalRelationships()"
        [activeDatasetFields]="datasetFields()"
        (groupingsChange)="onGroupingsChange($event)"
        (additionalRelationshipsChange)="onRelationshipsChange($event)"
        (schemaLoad)="onSchemaLoad($event)"
        (fieldSelect)="onAddField($event)"
      />
    </div>

    <!-- Middle Panel: Dataset View (Preview Table) -->
    <div class="workbench-panel panel-dataset-view">
      <gp-dataset-preview
        [fields]="datasetFields()"
        [datasetName]="dataset().name"
        [filters]="dataset().filters || []"
        [customData]="customData()"
        [customDataLoader]="customDataLoader()"
        [dataSourceConfig]="dataSourceConfig()"
        (filterRemove)="onFilterRemove($event)"
        (filtersClear)="onFiltersClear()"
        (dataSourceLoaded)="dataSourceLoaded.emit($event)"
        (dataSourceReset)="dataSourceReset.emit()"
      />
    </div>

    <!-- Right Panel: Selected Fields & Properties (Field Selector) -->
    <div class="workbench-panel panel-fields">
      <gp-dataset-field-selector
        [fields]="datasetFields()"
        [filters]="dataset().filters || []"
        [(selectedFieldId)]="selectedFieldId"
        (fieldsChange)="onFieldsChange($event)"
        (filtersChange)="onFiltersChange($event)"
        (fieldDrop)="onAddField($event)"
        (fieldRemove)="onFieldRemove($event)"
      />
    </div>
  </div>
</div>
