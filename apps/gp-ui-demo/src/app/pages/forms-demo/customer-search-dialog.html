<div class="customer-search-modal">
  <div class="customer-search-modal__header">
    <p class="customer-search-modal__desc">
      Dynamically launched by <code>GpDialogService</code>. Filter enterprise customers and click
      <strong>Select</strong> to return results directly to the typeahead.
    </p>
    <div class="customer-search-modal__search-row">
      <gp-input-text
        class="customer-search-modal__input"
        placeholder="Filter customers by name, territory, or ID..."
        [value]="filterQuery"
        (valueChange)="filterQuery = $event"
      />
      <gp-button label="Filter" icon="search" />
    </div>
  </div>

  <div class="customer-search-modal__table-container">
    <table class="customer-search-modal__table">
      <thead class="customer-search-modal__thead">
        <tr>
          <th class="customer-search-modal__th">Customer Name</th>
          <th class="customer-search-modal__th">Tier</th>
          <th class="customer-search-modal__th">Location</th>
          <th class="customer-search-modal__th customer-search-modal__th--action">Action</th>
        </tr>
      </thead>
      <tbody class="customer-search-modal__tbody">
        @for (cust of filteredCustomers(); track cust.id) {
        <tr class="customer-search-modal__row">
          <td class="customer-search-modal__td customer-search-modal__td--name">{{ cust.name }}</td>
          <td class="customer-search-modal__td">
            <gp-badge [value]="cust.tier" [severity]="cust.tier === 'Enterprise' ? 'primary' : 'success'" />
          </td>
          <td class="customer-search-modal__td customer-search-modal__td--location">{{ cust.location }}</td>
          <td class="customer-search-modal__td customer-search-modal__td--action">
            <gp-button label="Select" size="sm" icon="check" (onClickEvent)="chooseCustomer(cust)" />
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
