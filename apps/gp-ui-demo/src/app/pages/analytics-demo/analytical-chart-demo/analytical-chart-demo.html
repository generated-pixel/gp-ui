<div class="analytics-page">
  <gp-toast />

  <div class="analytics-page__header">
    <div class="analytics-page__badges">
      <gp-badge value="gp-analytical-chart" severity="primary" />
      <gp-badge value="gp-analytics" severity="info" />
    </div>
    <h1 class="analytics-page__title">Analytical Chart</h1>
    <p class="analytics-page__desc">
      Bar, donut, and line chart widget for rendering a categorical measure across one or more series.
    </p>
  </div>

  <div class="analytics-page__section">
    <h2 class="analytics-page__section-title">Live Demo</h2>
    <div class="analytics-page__demo">
      <gp-analytical-chart
        widgetId="chart-regional"
        title="Revenue Distribution by Region"
        [type]="chartType()"
        [data]="chartData()"
        [stacked]="false"
        [enableSvgExport]="true"
        (refresh)="onRefresh($event)"
        (exportData)="onExportData($event)"
      />
    </div>
  </div>

  <div class="analytics-page__section">
    <h2 class="analytics-page__section-title">Usage</h2>
    <doc-code [code]="usageCode" language="html" />
  </div>

  <div class="analytics-page__section">
    <h2 class="analytics-page__section-title">API Reference</h2>
    <doc-api-table title="Properties (Inputs)" [properties]="properties" />
    <doc-api-table title="Events (Outputs)" [properties]="events" [hasDefaults]="false" />
  </div>
</div>
