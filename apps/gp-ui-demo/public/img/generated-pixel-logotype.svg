<svg width="320" height="96" viewBox="0 0 320 96"
    xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
    <title id="title">Generated Pixel Wordmark</title>
    <desc id="desc">Generated Pixel name paired with pixel inspired monogram</desc>
    <defs>
        <linearGradient id="gpWordGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5de4ff" />
            <stop offset="50%" stop-color="#6f7dff" />
            <stop offset="100%" stop-color="#a855f7" />
        </linearGradient>
    </defs>
    <rect width="320" height="96" rx="20" fill="#0b1220" />
    <g transform="translate(24,24)">
        <rect width="48" height="48" rx="12" fill="#121c34" />
        <g fill="url(#gpWordGradient)" transform="translate(8,8)">
            <rect x="0" y="0" width="12" height="12" rx="3" />
            <rect x="18" y="0" width="12" height="12" rx="3" />
            <rect x="36" y="0" width="12" height="12" rx="3" />
            <rect x="0" y="18" width="12" height="12" rx="3" />
            <rect x="0" y="36" width="12" height="12" rx="3" />
            <rect x="18" y="36" width="12" height="12" rx="3" />
            <rect x="36" y="36" width="12" height="12" rx="3" />
            <rect x="36" y="18" width="12" height="12" rx="3" />
        </g>
    </g>
    <text x="104" y="60" font-family="'Segoe UI', 'Inter', sans-serif" font-size="40" font-weight="700" fill="#f8fafc" letter-spacing="1">
    Generated <tspan fill="url(#gpWordGradient)">Pixel</tspan>
    </text>
    <text x="104" y="80" font-family="'Segoe UI', 'Inter', sans-serif" font-size="16" fill="#94a3b8" letter-spacing="2">
    SOFTWARE ENGINEERING STUDIO
    </text>
</svg>
