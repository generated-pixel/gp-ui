name: CI - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Architectural Linter
        run: npm run lint

      - name: Run Automated Unit Tests
        run: npm test

      - name: Run External Consumer Validation Test
        run: npm run test:consumer

      - name: Build Monorepo (Themes, Icons, Library, Demo)
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gp-ui-dist
          path: dist/
          retention-days: 7
