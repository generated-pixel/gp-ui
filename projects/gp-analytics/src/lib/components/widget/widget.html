<article
  class="gp-widget"
  [class.gp-widget--highlighted]="effectiveHighlighted()"
  [class.gp-widget--compact]="compact()"
  [class]="toneClass()"
  [ngStyle]="customStyle()"
  [attr.aria-label]="t.widgetAriaLabel"
>
  <div class="gp-widget-header">
    <div class="gp-widget-title-row">
      <span class="gp-widget-title-start">
        <ng-content select="[gpWidgetTitleStart]"></ng-content>
      </span>
      <h3 class="gp-widget-title">{{ resolvedTitle() }}</h3>
      <span class="gp-widget-title-end">
        <ng-content select="[gpWidgetTitleEnd]"></ng-content>
      </span>
    </div>
  </div>

  <div class="gp-widget-body">
    @if (item()?.data?.summary) {
      <p class="gp-widget-summary">{{ item()?.data?.summary }}</p>
    }

    @if (item()?.data?.points?.length) {
      <div class="gp-widget-points" role="list">
        @for (point of item()!.data.points!; track point.key) {
          <div class="gp-widget-points__row" role="listitem">
            <span class="gp-widget-points__label">{{ point.label }}</span>
            <span class="gp-widget-points__value">{{ formatPointValue(point) }}</span>
          </div>
        }
      </div>
    } @else if (item()) {
      <p class="gp-widget-empty">{{ t.widgetItemNoDataLabel }}</p>
    }

    <ng-content></ng-content>
  </div>
</article>
