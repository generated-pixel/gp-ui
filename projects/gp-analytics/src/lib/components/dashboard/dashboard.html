<section class="gp-dashboard" [ngStyle]="themeStyle()" [attr.aria-label]="t.dashboardAriaLabel">
  <div class="gp-dashboard-header">
    <p class="gp-dashboard-eyebrow">{{ t.dashboardEyebrow }}</p>
    <div class="gp-dashboard-header__row">
      <h2 class="gp-dashboard-title">{{ resolvedTitle() }}</h2>
      @if (hasManagedWidgets()) {
        <button
          class="gp-dashboard-shortcuts-toggle"
          type="button"
          [attr.aria-label]="keyboardHelpToggleLabel()"
          [attr.aria-expanded]="keyboardHelpVisible()"
          [attr.aria-controls]="keyboardHelpId"
          [title]="keyboardHelpToggleLabel()"
          (click)="toggleKeyboardHelp()"
        >
          ?
        </button>
      }
    </div>
  </div>

  @if (hasManagedWidgets()) {
    <p class="gp-dashboard-help" [id]="keyboardHelpId" [hidden]="!keyboardHelpVisible()">
      {{ t.dashboardKeyboardHint }}
    </p>

    <div
      class="gp-dashboard-grid gp-dashboard-grid--managed"
      [style.--gp-dashboard-cell-width]="cellWidth() + 'px'"
      [style.--gp-dashboard-cell-height]="cellHeight() + 'px'"
      [style.--gp-dashboard-gap]="gridGap() + 'px'"
      [style.width.px]="gridWidthPx()"
      [style.height.px]="gridHeightPx()"
      role="list"
    >
      @for (widget of managedWidgets(); track widget.id) {
        <article
          class="gp-dashboard-tile"
          [attr.data-widget-id]="widget.id"
          [class.gp-dashboard-tile--locked]="isWidgetLocked(widget)"
          [class.gp-dashboard-tile--fixed]="isWidgetFixed(widget)"
          [style.left.px]="tileLeftPx(widget)"
          [style.top.px]="tileTopPx(widget)"
          [style.width.px]="tileWidthPx(widget)"
          [style.height.px]="tileHeightPx(widget)"
          role="listitem"
        >
          <gp-widget
            [item]="widget.item"
            [title]="widget.title"
            [highlighted]="widget.highlighted ?? false"
          >
            <button
              gpWidgetTitleStart
              class="gp-dashboard-tile__move"
              type="button"
              [disabled]="isWidgetLocked(widget) || isWidgetFixed(widget)"
              [attr.aria-label]="isWidgetFixed(widget) ? 'Widget position fixed' : 'Move widget'"
              [attr.aria-describedby]="keyboardHelpVisible() ? keyboardHelpId : null"
              aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown"
              title="Move widget"
              (pointerdown)="startMove($event, widget)"
              (keydown)="onMoveKeydown($event, widget)"
            >
              <gp-icon [name]="'drag-handle'" [size]="14"></gp-icon>
              <span class="gp-dashboard-tile__sr-only">Move widget</span>
            </button>

            @if (!isWidgetFixed(widget)) {
              <button
                gpWidgetTitleStart
                class="gp-dashboard-tile__lock-toggle"
                type="button"
                [disabled]="locked()"
                [attr.aria-label]="lockToggleLabel(widget)"
                [title]="lockToggleLabel(widget)"
                (click)="toggleWidgetLocked(widget)"
              >
                <gp-icon [name]="lockIcon(widget)" [size]="14"></gp-icon>
                <span class="gp-dashboard-tile__sr-only">{{ lockToggleLabel(widget) }}</span>
              </button>
            }

            @if (canRemoveWidget(widget)) {
              <button
                gpWidgetTitleEnd
                class="gp-dashboard-tile__remove"
                type="button"
                [attr.aria-label]="'Remove widget'"
                title="Remove widget"
                (click)="removeWidget(widget.id)"
              >
                <gp-icon [name]="'remove'" [size]="12"></gp-icon>
                <span class="gp-dashboard-tile__sr-only">Remove widget</span>
              </button>
            }
          </gp-widget>

          <button
            class="gp-dashboard-tile__resize"
            type="button"
            [disabled]="isWidgetLocked(widget)"
            [attr.aria-label]="'Resize widget'"
            [attr.aria-describedby]="keyboardHelpVisible() ? keyboardHelpId : null"
            aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown"
            title="Resize widget"
            (pointerdown)="startResize($event, widget)"
            (keydown)="onResizeKeydown($event, widget)"
          >
            <gp-icon [name]="'settings'" [size]="12"></gp-icon>
            <span class="gp-dashboard-tile__sr-only">Resize widget</span>
          </button>
        </article>
      }
    </div>
  } @else {
    <div class="gp-dashboard-grid">
      <ng-content></ng-content>
    </div>
  }
</section>
